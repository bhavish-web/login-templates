<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Perry &amp; Ashworth — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#efe6d3; --card:#faf4e6; --ink:#2b2115; --dim:#877556; --brass:#8a6a35; --brass-bright:#a5804a; --line:#ddccae;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--paper); color:var(--ink); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:60px 24px; position:relative; overflow:hidden;
  }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  :focus-visible{ outline:1px solid var(--brass); outline-offset:2px; }

  .glass-wrap{ display:flex; justify-content:center; margin-bottom:18px; }
  .glass{ width:52px; height:52px; animation:sweep 1s cubic-bezier(.4,0,.2,1) forwards; }
  @keyframes sweep{
    0%{ transform:translate(-60px,-14px) rotate(-18deg) scale(.7); opacity:0; }
    60%{ transform:translate(4px,2px) rotate(4deg) scale(1.05); opacity:1; }
    100%{ transform:translate(0,0) rotate(0deg) scale(1); opacity:1; }
  }
  .glass circle{ fill:rgba(138,106,53,0.05); stroke:var(--brass); stroke-width:2; }
  .glass line{ stroke:var(--brass); stroke-width:2.5; stroke-linecap:round; }

  .stage{ width:100%; max-width:380px; text-align:center; }

  .brand{ font-size:11px; letter-spacing:.2em; color:var(--brass); margin-bottom:14px;
    opacity:0; animation:fadeUp .6s cubic-bezier(.16,1,.3,1) forwards; animation-delay:.9s; }
  h1{ font-family:'Fraunces', serif; font-weight:600; font-size:26px; margin-bottom:8px;
    opacity:0; animation:fadeUp .6s cubic-bezier(.16,1,.3,1) forwards; animation-delay:.96s; }
  .sub{ font-size:13.5px; color:var(--dim); margin-bottom:30px;
    opacity:0; animation:fadeUp .6s cubic-bezier(.16,1,.3,1) forwards; animation-delay:1.02s; }
  @keyframes fadeUp{ to{ opacity:1; transform:none; } }
  h1, .sub{ transform:translateY(6px); }

  .panel{ text-align:left; background:var(--card); border:1px solid var(--line); padding:36px 32px;
    opacity:0; animation:fadeUp .7s cubic-bezier(.16,1,.3,1) forwards; animation-delay:1.08s; }

  .tabs{ display:flex; gap:24px; margin-bottom:28px; }
  .tabs button{ background:none; border:1.5px solid transparent; color:var(--dim); font-size:12px; font-weight:600; padding:6px 0 8px; cursor:pointer; transition:color .3s ease, border-color .3s ease; }
  .tabs button.active{ color:var(--brass); border-bottom-color:var(--brass); }

  .field{ margin-bottom:20px; }
  .field label{ display:block; font-size:11px; letter-spacing:.04em; color:var(--dim); margin-bottom:6px; }
  .field input{ width:100%; background:var(--paper); border:1.5px solid var(--line); color:var(--ink); font-size:15px; padding:10px 32px 10px 12px; outline:none; transition:border-color .2s ease; }
  .field input:focus{ border-color:var(--brass); }
  .field input::placeholder{ color:var(--dim); opacity:.55; }
  .extra{ max-height:0; opacity:0; overflow:hidden; transition:max-height .5s cubic-bezier(.4,0,.2,1), opacity .35s ease; }
  .field-wrap{ position:relative; }
  .eye-btn{ position:absolute; right:2px; bottom:6px; background:none; border:none; padding:5px; cursor:pointer; color:var(--dim); display:flex; }
  .eye-btn:hover{ color:var(--brass); }
  .eye-btn svg{ width:15px; height:15px; }

  .row-between{ display:flex; justify-content:space-between; font-size:12px; color:var(--dim); margin:0 0 24px; }
  .row-between a{ color:var(--dim); text-decoration:none; border-bottom:1px solid var(--line); }
  .row-between a:hover{ color:var(--brass); }
  .checkbox{ display:flex; align-items:center; gap:7px; }
  .checkbox input{ accent-color:var(--brass); width:13px; height:13px; }

  button.enter{ width:100%; background:var(--ink); border:none; color:var(--paper); font-size:13.5px; font-weight:600; padding:13px; cursor:pointer; transition:background .25s ease, transform .1s ease; }
  button.enter:hover{ background:var(--brass-bright); }
  button.enter:active{ transform:scale(.99); }

  .foot{ text-align:center; font-size:12.5px; color:var(--dim); margin-top:22px; }
  .foot a{ color:var(--brass); text-decoration:none; font-weight:600; }
  .foot a:hover{ text-decoration:underline; }
</style>
</head>
<body>

<div class="stage">
  <div class="glass-wrap">
    <svg class="glass" viewBox="0 0 52 52"><circle cx="21" cy="21" r="15"/><line x1="32" y1="32" x2="46" y2="46"/></svg>
  </div>

  <div class="brand">PERRY &amp; ASHWORTH, BOOKSELLERS</div>
  <h1 id="heading">Sign in</h1>
  <p class="sub" id="subhead">Your want-list, holds, and auction alerts.</p>

  <div class="panel">
    <div class="tabs" id="tabs">
      <button class="active" data-tab="signin" type="button">Sign In</button>
      <button data-tab="signup" type="button">Create account</button>
    </div>

    <form onsubmit="return false;">
      <div class="field extra" id="nameField"><div class="field-wrap">
        <label for="nameInput">Full name</label>
        <input type="text" id="nameInput" placeholder="Jordan Rivera" autocomplete="name" />
      </div></div>
      <div class="field"><div class="field-wrap">
        <label for="emailInput">Email address</label>
        <input type="email" id="emailInput" placeholder="you@company.com" required autocomplete="email" />
      </div></div>
      <div class="field"><div class="field-wrap">
        <label for="pwInput">Password</label>
        <input type="password" id="pwInput" placeholder="••••••••••••" required autocomplete="current-password" class="has-eye" />
        <button type="button" class="eye-btn" data-for="pwInput" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div></div>
      <div class="row-between" id="signinOnlyRow">
        <label class="checkbox"><input type="checkbox" /> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>
      <button class="enter" type="submit"><span id="submitLabel">Sign In</span></button>
    </form>

    <p class="foot" id="footNote">New here? <a data-switch="signup">Create an account</a></p>
  </div>
</div>

<script>
(function(){
  document.querySelectorAll('.eye-btn').forEach(function(btn){
    var input = document.getElementById(btn.dataset.for);
    var showing = false;
    btn.addEventListener('click', function(){
      showing = !showing;
      input.type = showing ? 'text' : 'password';
      btn.setAttribute('aria-pressed', showing ? 'true' : 'false');
      btn.setAttribute('aria-label', showing ? 'Hide password' : 'Show password');
    });
  });

  var tabs = document.querySelectorAll('#tabs button[data-tab]');
  var nameField = document.getElementById('nameField');
  var signinOnlyRow = document.getElementById('signinOnlyRow');
  var heading = document.getElementById('heading');
  var subhead = document.getElementById('subhead');
  var submitLabel = document.getElementById('submitLabel');
  var footNote = document.getElementById('footNote');

  var COPY = {
    signin: { heading:'Sign in', sub:'Your want-list, holds, and auction alerts.', submit:'Sign In', foot:'New here? <a data-switch="signup">Create an account</a>' },
    signup: { heading:'Create your account', sub:'Set up a want-list and get notified of new finds.', submit:'Create account', foot:'Already have an account? <a data-switch="signin">Sign in</a>' }
  };
  function bindSwitchLinks(){ document.querySelectorAll('[data-switch]').forEach(function(a){ a.addEventListener('click', function(e){ e.preventDefault(); setMode(a.getAttribute('data-switch')); }); }); }
  function setMode(mode){
    tabs.forEach(function(t){ t.classList.toggle('active', t.dataset.tab===mode); });
    var showExtra = mode==='signup';
    nameField.style.maxHeight = showExtra ? nameField.scrollHeight+'px' : '0px';
    nameField.style.opacity = showExtra?1:0;
    signinOnlyRow.style.display = mode==='signin' ? 'flex' : 'none';
    heading.textContent = COPY[mode].heading;
    subhead.textContent = COPY[mode].sub;
    submitLabel.textContent = COPY[mode].submit;
    footNote.innerHTML = COPY[mode].foot;
    bindSwitchLinks();
  }
  tabs.forEach(function(t){ t.addEventListener('click', function(){ setMode(t.dataset.tab); }); });
  bindSwitchLinks();
  window.addEventListener('message', function(e){ if(e.data && e.data.type==='loginkit-accent'){ document.documentElement.style.setProperty('--brass', e.data.color); } });
})();
</script>

</body>
</html>
