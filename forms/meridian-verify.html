<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meridian Exchange — Verify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0e1526; --card:#141d34; --line:rgba(202,169,104,0.16);
    --gold:#caa968; --gold-bright:#e8d3a0; --cream:#eef0f7; --dim:#7c869e;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--navy); color:var(--cream); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:60px 24px;
  }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  :focus-visible{ outline:1px solid var(--gold-bright); outline-offset:2px; }

  .stage{ width:100%; max-width:380px; text-align:center;
    opacity:0; transform:translateY(14px); animation:reveal .9s cubic-bezier(.16,1,.3,1) forwards; animation-delay:.1s; }
  @keyframes reveal{ to{ opacity:1; transform:none; } }

  .brand{ font-size:11px; letter-spacing:.22em; color:var(--gold); margin-bottom:22px; }
  h1{ font-family:'Playfair Display', serif; font-weight:600; font-size:26px; margin-bottom:10px; }
  .sub{ font-size:13.5px; color:var(--dim); margin-bottom:6px; line-height:1.5; }
  .sub b{ color:var(--cream); font-weight:600; }

  .panel{ background:var(--card); border:1px solid var(--line); padding:38px 32px; border-radius:3px; margin-top:28px; }

  .otp-row{ display:flex; gap:9px; justify-content:center; margin-bottom:24px; }
  .otp-row input{
    width:44px; height:54px; text-align:center; font-size:22px; font-family:'Inter', sans-serif; font-weight:600;
    background:rgba(255,255,255,0.03); border:1.5px solid var(--line); border-radius:3px; color:var(--cream); outline:none;
    transition:border-color .25s ease, box-shadow .25s ease;
  }
  .otp-row input:focus{ border-color:var(--gold); box-shadow:0 0 0 3px rgba(202,169,104,0.15); }
  .otp-row input.filled{ border-color:var(--gold-bright); }

  .status{ font-size:12px; color:var(--dim); margin-bottom:22px; min-height:16px; }
  .status.error{ color:#d1786a; }

  button.enter{ position:relative; width:100%; background:var(--gold); border:none; color:#171008; font-weight:600; font-size:13.5px; letter-spacing:.02em; padding:14px; border-radius:3px; cursor:pointer; transition:filter .3s ease, transform .1s ease, opacity .3s ease; }
  button.enter:hover{ filter:brightness(1.08); }
  button.enter:active{ transform:scale(.99); }
  button.enter:disabled{ opacity:.4; cursor:not-allowed; filter:none; }

  .resend{ margin-top:20px; font-size:12.5px; color:var(--dim); }
  .resend button{ background:none; border:none; color:var(--gold-bright); cursor:pointer; font-size:12.5px; padding:0; text-decoration:underline; }
  .resend button:disabled{ color:var(--dim); text-decoration:none; cursor:default; }

  .foot{ text-align:center; font-size:12.5px; color:var(--dim); margin-top:22px; }
  .foot a{ color:var(--gold-bright); text-decoration:none; }
  .foot a:hover{ text-decoration:underline; }
</style>
</head>
<body>

<div class="stage">
  <div class="brand">MERIDIAN EXCHANGE</div>
  <h1>Check your inbox</h1>
  <p class="sub">We sent a 6-digit code to <b id="emailDisplay">j***@company.com</b></p>

  <div class="panel">
    <div class="otp-row" id="otpRow">
      <input type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Digit 1" />
      <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2" />
      <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 3" />
      <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4" />
      <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 5" />
      <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 6" />
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <button class="enter" id="verifyBtn" type="button" disabled>Verify code</button>
    <p class="resend">Didn't get it? <button id="resendBtn" type="button" disabled>Resend in <span id="timer">30</span>s</button></p>
  </div>

  <p class="foot">Wrong email? <a href="#">Start over</a></p>
</div>

<script>
(function(){
  var inputs = [].slice.call(document.querySelectorAll('#otpRow input'));
  var verifyBtn = document.getElementById('verifyBtn');
  var resendBtn = document.getElementById('resendBtn');
  var statusEl = document.getElementById('status');
  var timerEl = document.getElementById('timer');

  function updateVerifyState(){
    var filled = inputs.every(function(i){ return i.value.length === 1; });
    verifyBtn.disabled = !filled;
  }

  inputs.forEach(function(input, idx){
    input.addEventListener('input', function(){
      input.value = input.value.replace(/[^0-9]/g, '').slice(0, 1);
      input.classList.toggle('filled', input.value.length === 1);
      if(input.value && idx < inputs.length - 1) inputs[idx + 1].focus();
      updateVerifyState();
    });
    input.addEventListener('keydown', function(e){
      if(e.key === 'Backspace' && !input.value && idx > 0){
        inputs[idx - 1].focus();
      }
    });
    input.addEventListener('paste', function(e){
      e.preventDefault();
      var text = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
      if(!text) return;
      text.split('').slice(0, inputs.length).forEach(function(ch, i){
        inputs[i].value = ch;
        inputs[i].classList.add('filled');
      });
      var next = Math.min(text.length, inputs.length - 1);
      inputs[next].focus();
      updateVerifyState();
    });
  });

  verifyBtn.addEventListener('click', function(){
    var code = inputs.map(function(i){ return i.value; }).join('');
    statusEl.textContent = 'Verifying ' + code + '… (demo only, no real request is sent)';
    statusEl.classList.remove('error');
  });

  var seconds = 30;
  var countdown = setInterval(function(){
    seconds--;
    timerEl.textContent = seconds;
    if(seconds <= 0){
      clearInterval(countdown);
      resendBtn.disabled = false;
      resendBtn.textContent = 'Resend code';
    }
  }, 1000);

  resendBtn.addEventListener('click', function(){
    if(resendBtn.disabled) return;
    statusEl.textContent = 'A new code was sent.';
    statusEl.classList.remove('error');
    resendBtn.disabled = true;
    seconds = 30;
    var el = document.createElement('span');
    el.id = 'timer';
    el.textContent = seconds;
    resendBtn.textContent = '';
    resendBtn.appendChild(document.createTextNode('Resend in '));
    resendBtn.appendChild(el);
    resendBtn.appendChild(document.createTextNode('s'));
    countdown = setInterval(function(){
      seconds--;
      el.textContent = seconds;
      if(seconds <= 0){
        clearInterval(countdown);
        resendBtn.disabled = false;
        resendBtn.textContent = 'Resend code';
      }
    }, 1000);
  });

  window.addEventListener('message', function(e){
    if(e.data && e.data.type === 'loginkit-accent'){
      document.documentElement.style.setProperty('--gold', e.data.color);
    }
  });
})();
</script>

</body>
</html>
