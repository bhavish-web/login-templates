<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Bordeaux Press — Reader Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f7f1e6; --card:#fffdf8; --line:#ddccae; --wine:#6e2331; --wine-bright:#8c3244;
    --ink:#241a16; --dim:#8a7458;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--paper); color:var(--ink); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:60px 24px; perspective:1800px;
  }

  .masthead{
    text-align:center; margin-bottom:34px;
    opacity:0; animation:fadeIn .7s ease forwards; animation-delay:.1s;
  }
  .masthead .name{ font-family:'Fraunces', serif; font-size:15px; letter-spacing:.24em; color:var(--wine); }
  .masthead .rule-pair{ display:flex; align-items:center; gap:10px; margin-top:10px; }
  .masthead .rule-pair span{ flex:1; height:1px; background:var(--line); }
  .masthead .rule-pair::before, .masthead .rule-pair::after{ content:"◆"; font-size:8px; color:var(--wine); }
  @keyframes fadeIn{ to{ opacity:1; } }

  .flip-stage{ width:100%; max-width:400px; position:relative; min-height:560px;
    opacity:0; transform:translateY(14px); animation:fadeUp .8s cubic-bezier(.16,1,.3,1) forwards; animation-delay:.25s; }
  @keyframes fadeUp{ to{ opacity:1; transform:none; } }

  .flip-inner{ position:relative; width:100%; height:100%; transition:transform .75s cubic-bezier(.65,0,.35,1); transform-style:preserve-3d; }
  .flip-stage.flipped .flip-inner{ transform:rotateY(-180deg); }

  .page{
    position:absolute; inset:0; backface-visibility:hidden; background:var(--card); border:1px solid var(--line);
    padding:42px 38px; box-shadow:0 30px 60px -30px rgba(110,35,49,0.25);
  }
  .page.back{ transform:rotateY(180deg); }

  h1{ font-family:'Fraunces', serif; font-weight:600; font-size:27px; line-height:1.15; margin-bottom:8px; }
  .sub{ font-size:13.5px; color:var(--dim); margin-bottom:30px; line-height:1.5; }

  .field{ position:relative; margin-bottom:24px; }
  .field label{ position:absolute; left:0; top:11px; font-size:14px; color:var(--dim); pointer-events:none; transition:transform .3s cubic-bezier(.4,0,.2,1), font-size .3s ease, color .3s ease; transform-origin:left top; }
  .field input{ width:100%; background:none; border:none; border-bottom:1px solid var(--line); color:var(--ink); font-size:15px; padding:10px 0; outline:none; transition:border-color .3s ease; }
  .field .underline-accent{ position:absolute; left:0; right:0; bottom:-1px; height:1.5px; background:var(--wine); transform:scaleX(0); transition:transform .4s cubic-bezier(.65,0,.35,1); }
  .field input:focus ~ .underline-accent{ transform:scaleX(1); }
  .field input:focus{ border-color:transparent; }
  .field input:focus + label, .field input:not(:placeholder-shown) + label{ transform:translateY(-19px); font-size:11px; color:var(--wine); }
  .field input::placeholder{ color:transparent; }

  .row-between{ display:flex; justify-content:space-between; font-size:12px; color:var(--dim); margin:0 0 28px; }
  .row-between a{ color:var(--dim); text-decoration:none; border-bottom:1px solid var(--line); }
  .row-between a:hover{ color:var(--wine); }
  .checkbox{ display:flex; align-items:center; gap:7px; }
  .checkbox input{ accent-color:var(--wine); width:13px; height:13px; }

  button.enter{ position:relative; width:100%; background:var(--wine); border:none; color:var(--card);
    font-family:'Fraunces', serif; font-style:italic; font-size:17px; padding:14px; cursor:pointer; transition:background .3s ease, transform .1s ease; }
  button.enter:hover{ background:var(--wine-bright); }
  button.enter:active{ transform:scale(.99); }

  .divider{ display:flex; align-items:center; gap:14px; margin:24px 0; color:var(--dim); font-size:11px; }
  .divider::before,.divider::after{ content:""; flex:1; height:1px; background:var(--line); }
  button.ghost{ width:100%; background:none; border:1px solid var(--line); color:var(--ink); font-size:13px; padding:12px; cursor:pointer; transition:border-color .2s ease; }
  button.ghost:hover{ border-color:var(--wine); }

  .foot{ text-align:center; font-size:12.5px; color:var(--dim); margin-top:22px; }
  .foot a{ color:var(--wine); text-decoration:none; cursor:pointer; font-weight:600; }
  .foot a:hover{ text-decoration:underline; }
  :focus-visible{ outline:1px solid var(--wine); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }
</style>
</head>
<body>

<div>
  <div class="masthead">
    <div class="name">THE BORDEAUX PRESS</div>
    <div class="rule-pair"><span></span></div>
  </div>

  <div class="flip-stage" id="flipStage">
    <div class="flip-inner">
      <div class="page front">
        <h1>Reader sign in</h1>
        <p class="sub">Your subscription, your annotations, your reading list.</p>
        <form onsubmit="return false;">
          <div class="field">
            <input type="email" placeholder=" " id="emailInputA" required />
            <label for="emailInputA">Email address</label>
            <span class="underline-accent"></span>
          </div>
          <div class="field">
            <input type="password" placeholder=" " id="pwInputA" required />
            <label for="pwInputA">Password</label>
            <span class="underline-accent"></span>
          </div>
          <div class="row-between">
            <label class="checkbox"><input type="checkbox" /> Remember me</label>
            <a href="#">Forgot password?</a>
          </div>
          <button class="enter" type="submit">Sign in</button>
        </form>
        <div class="divider">or continue with</div>
        <button class="ghost" type="button">Google</button>
        <p class="foot">New reader? <a data-flip>Start a subscription</a></p>
      </div>

      <div class="page back">
        <h1>Start your subscription</h1>
        <p class="sub">Full archive access, delivered weekly.</p>
        <form onsubmit="return false;">
          <div class="field">
            <input type="text" placeholder=" " id="nameInputB" />
            <label for="nameInputB">Full name</label>
            <span class="underline-accent"></span>
          </div>
          <div class="field">
            <input type="email" placeholder=" " id="emailInputB" required />
            <label for="emailInputB">Email address</label>
            <span class="underline-accent"></span>
          </div>
          <div class="field">
            <input type="password" placeholder=" " id="pwInputB" required />
            <label for="pwInputB">Password</label>
            <span class="underline-accent"></span>
          </div>
          <button class="enter" type="submit" style="margin-top:6px;">Subscribe</button>
        </form>
        <p class="foot" style="margin-top:24px;">Already a reader? <a data-flip>Sign in</a></p>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var stage = document.getElementById('flipStage');
  document.querySelectorAll('[data-flip]').forEach(function(a){
    a.addEventListener('click', function(e){ e.preventDefault(); stage.classList.toggle('flipped'); });
  });
  window.addEventListener('message', function(e){ if(e.data && e.data.type==='loginkit-accent'){ document.documentElement.style.setProperty('--wine', e.data.color); } });
})();
</script>

</body>
</html>
