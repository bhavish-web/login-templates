<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Signal Room — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --slate:#10161a; --card:#161e23; --wave:#4fa3a8; --wave-bright:#7ecdd1; --line:rgba(79,163,168,0.16); --cream:#e7eef0; --dim:#7c8f93;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--slate); color:var(--cream); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;
    min-height:100vh; display:grid; grid-template-columns:1fr 1fr;
  }
  @media(max-width:860px){ body{ grid-template-columns:1fr; } .wave-side{ display:none; } }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  :focus-visible{ outline:1px solid var(--wave-bright); outline-offset:2px; }

  .wave-side{ position:relative; background:linear-gradient(170deg, #131b20, #10161a); display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .scope{ width:78%; }
  .grid-line{ stroke:rgba(79,163,168,0.08); stroke-width:1; }
  .wave-path{ fill:none; stroke:var(--wave); stroke-width:1.5; stroke-dasharray:900; stroke-dashoffset:900; animation:trace 2.2s cubic-bezier(.4,0,.2,1) forwards; animation-delay:.2s; }
  @keyframes trace{ to{ stroke-dashoffset:0; } }
  .freq-label{ font-family:'Inter', monospace; font-size:11px; color:var(--dim); text-align:center; margin-top:14px;
    opacity:0; animation:fadeIn .6s ease forwards; animation-delay:2.3s; }
  @keyframes fadeIn{ to{ opacity:1; } }

  .form-side{ display:flex; align-items:center; justify-content:center; padding:48px; }
  .panel{ width:100%; max-width:360px;
    opacity:0; transform:translateY(14px); animation:reveal .9s cubic-bezier(.16,1,.3,1) forwards; animation-delay:.15s; }
  @keyframes reveal{ to{ opacity:1; transform:none; } }

  .brand{ font-size:11px; letter-spacing:.22em; color:var(--wave); margin-bottom:16px; }
  h1{ font-family:'Fraunces', serif; font-weight:600; font-size:27px; margin-bottom:8px; }
  .sub{ font-size:13.5px; color:var(--dim); margin-bottom:30px; }

  .tabs{ display:flex; gap:24px; margin-bottom:28px; border-bottom:1px solid var(--line); }
  .tabs button{ background:none; border:none; color:var(--dim); font-size:12.5px; font-weight:500; padding:0 0 12px; cursor:pointer; transition:color .3s ease; }
  .tabs button.active{ color:var(--wave-bright); }

  .field{ position:relative; margin-bottom:22px; }
  .field label{ display:block; font-size:11px; letter-spacing:.04em; color:var(--dim); margin-bottom:7px; }
  .field input{ width:100%; background:rgba(255,255,255,0.03); border:1px solid var(--line); color:var(--cream); font-size:15px; padding:10px 32px 10px 12px; border-radius:2px; outline:none; transition:border-color .2s ease; }
  .field input:focus{ border-color:var(--wave); }
  .field input::placeholder{ color:var(--dim); opacity:.5; }
  .extra{ max-height:0; opacity:0; overflow:hidden; transition:max-height .5s cubic-bezier(.4,0,.2,1), opacity .35s ease; }
  .eye-btn{ position:absolute; right:2px; bottom:6px; background:none; border:none; padding:5px; cursor:pointer; color:var(--dim); display:flex; }
  .eye-btn:hover{ color:var(--wave-bright); }
  .eye-btn svg{ width:15px; height:15px; }

  .row-between{ display:flex; justify-content:space-between; font-size:12px; color:var(--dim); margin:0 0 26px; }
  .row-between a{ color:var(--dim); text-decoration:none; border-bottom:1px solid var(--line); }
  .row-between a:hover{ color:var(--wave-bright); }
  .checkbox{ display:flex; align-items:center; gap:7px; }
  .checkbox input{ accent-color:var(--wave); width:13px; height:13px; }

  button.enter{ width:100%; background:var(--wave); border:none; color:#0c1315; font-size:13.5px; font-weight:600; padding:13px; border-radius:2px; cursor:pointer; transition:background .25s ease, transform .1s ease; }
  button.enter:hover{ background:var(--wave-bright); }
  button.enter:active{ transform:scale(.99); }

  .foot{ text-align:center; font-size:12.5px; color:var(--dim); margin-top:22px; }
  .foot a{ color:var(--wave-bright); text-decoration:none; cursor:pointer; }
  .foot a:hover{ text-decoration:underline; }
</style>
</head>
<body>

<div class="wave-side">
  <div>
    <svg class="scope" viewBox="0 0 300 140">
      <line class="grid-line" x1="0" y1="70" x2="300" y2="70"/>
      <line class="grid-line" x1="75" y1="0" x2="75" y2="140"/><line class="grid-line" x1="150" y1="0" x2="150" y2="140"/><line class="grid-line" x1="225" y1="0" x2="225" y2="140"/>
      <path class="wave-path" d="M0 70 C 20 20, 40 20, 60 70 S 100 120, 120 70 S 160 20, 180 70 S 220 120, 240 70 S 280 20, 300 70"/>
    </svg>
    <div class="freq-label">102.7 MHz — SIGNAL LOCKED</div>
  </div>
</div>

<div class="form-side">
  <div class="panel">
    <div class="brand">THE SIGNAL ROOM</div>
    <h1 id="heading">Sign in</h1>
    <p class="sub" id="subhead">Your archive, recordings, and broadcast logs.</p>

    <div class="tabs" id="tabs">
      <button class="active" data-tab="signin" type="button">Sign In</button>
      <button data-tab="signup" type="button">Create account</button>
    </div>

    <form onsubmit="return false;">
      <div class="field extra" id="nameField">
        <label for="nameInput">Full name</label>
        <input type="text" id="nameInput" placeholder="Jordan Rivera" autocomplete="name" />
      </div>
      <div class="field">
        <label for="emailInput">Email address</label>
        <input type="email" id="emailInput" placeholder="you@company.com" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="pwInput">Password</label>
        <input type="password" id="pwInput" placeholder="••••••••••••" required autocomplete="current-password" class="has-eye" />
        <button type="button" class="eye-btn" data-for="pwInput" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <div class="row-between" id="signinOnlyRow">
        <label class="checkbox"><input type="checkbox" /> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>
      <button class="enter" type="submit"><span id="submitLabel">Sign In</span></button>
    </form>

    <p class="foot" id="footNote">New here? <a data-switch="signup">Create an account</a></p>
  </div>
</div>

<script>
(function(){
  document.querySelectorAll('.eye-btn').forEach(function(btn){
    var input = document.getElementById(btn.dataset.for);
    var showing = false;
    btn.addEventListener('click', function(){
      showing = !showing;
      input.type = showing ? 'text' : 'password';
      btn.setAttribute('aria-pressed', showing ? 'true' : 'false');
      btn.setAttribute('aria-label', showing ? 'Hide password' : 'Show password');
    });
  });

  var tabs = document.querySelectorAll('#tabs button[data-tab]');
  var nameField = document.getElementById('nameField');
  var signinOnlyRow = document.getElementById('signinOnlyRow');
  var heading = document.getElementById('heading');
  var subhead = document.getElementById('subhead');
  var submitLabel = document.getElementById('submitLabel');
  var footNote = document.getElementById('footNote');

  var COPY = {
    signin: { heading:'Sign in', sub:'Your archive, recordings, and broadcast logs.', submit:'Sign In', foot:'New here? <a data-switch="signup">Create an account</a>' },
    signup: { heading:'Create your account', sub:'Start archiving your own recordings.', submit:'Create account', foot:'Already have an account? <a data-switch="signin">Sign in</a>' }
  };
  function bindSwitchLinks(){ document.querySelectorAll('[data-switch]').forEach(function(a){ a.addEventListener('click', function(e){ e.preventDefault(); setMode(a.getAttribute('data-switch')); }); }); }
  function setMode(mode){
    tabs.forEach(function(t){ t.classList.toggle('active', t.dataset.tab===mode); });
    var showExtra = mode==='signup';
    nameField.style.maxHeight = showExtra ? nameField.scrollHeight+'px' : '0px';
    nameField.style.opacity = showExtra?1:0;
    signinOnlyRow.style.display = mode==='signin' ? 'flex' : 'none';
    heading.textContent = COPY[mode].heading;
    subhead.textContent = COPY[mode].sub;
    submitLabel.textContent = COPY[mode].submit;
    footNote.innerHTML = COPY[mode].foot;
    bindSwitchLinks();
  }
  tabs.forEach(function(t){ t.addEventListener('click', function(){ setMode(t.dataset.tab); }); });
  bindSwitchLinks();
  window.addEventListener('message', function(e){ if(e.data && e.data.type==='loginkit-accent'){ document.documentElement.style.setProperty('--wave', e.data.color); } });
})();
</script>

</body>
</html>
