<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lumen Optics — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --graphite:#161819; --card:#1d2022; --steel:#b9c2c4; --steel-bright:#e2e8e9; --line:rgba(185,194,196,0.14); --dim:#7d8688;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--graphite); color:var(--steel-bright); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:60px 24px; position:relative; overflow:hidden;
  }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  :focus-visible{ outline:1px solid var(--steel-bright); outline-offset:2px; }

  .iris{ position:fixed; inset:0; pointer-events:none; z-index:2; }
  .iris path{ fill:var(--graphite); }
  .blade{ transform-origin:50% 50%; animation:open .9s cubic-bezier(.65,0,.35,1) forwards; }
  .blade:nth-child(1){ animation-delay:0s; } .blade:nth-child(2){ animation-delay:.03s; }
  .blade:nth-child(3){ animation-delay:.06s; } .blade:nth-child(4){ animation-delay:.09s; }
  .blade:nth-child(5){ animation-delay:.12s; } .blade:nth-child(6){ animation-delay:.15s; }
  @keyframes open{ from{ transform:scale(1); } to{ transform:scale(2.4); } }

  .stage{ position:relative; z-index:1; width:100%; max-width:370px; text-align:center;
    opacity:0; animation:fadeIn .6s ease forwards; animation-delay:.7s; }
  @keyframes fadeIn{ to{ opacity:1; } }

  .brand{ font-size:11px; letter-spacing:.24em; color:var(--steel); margin-bottom:16px; }
  h1{ font-family:'Fraunces', serif; font-weight:600; font-size:27px; margin-bottom:8px; }
  .sub{ font-size:13.5px; color:var(--dim); margin-bottom:32px; }

  .panel{ text-align:left; }

  .tabs{ position:relative; display:flex; gap:24px; margin-bottom:28px; border-bottom:1px solid var(--line); }
  .tabs button{ background:none; border:none; color:var(--dim); font-size:12.5px; font-weight:500; padding:0 0 12px; cursor:pointer; transition:color .3s ease; }
  .tabs button.active{ color:var(--steel-bright); }
  .tab-indicator{ position:absolute; bottom:-1px; height:1.5px; background:var(--steel-bright); transition:transform .5s cubic-bezier(.65,0,.35,1), width .5s cubic-bezier(.65,0,.35,1); }

  .field{ position:relative; margin-bottom:24px; }
  .field label{ position:absolute; left:0; top:11px; font-size:14px; color:var(--dim); pointer-events:none; transition:transform .3s cubic-bezier(.4,0,.2,1), font-size .3s ease, color .3s ease; transform-origin:left top; }
  .field input{ width:100%; background:none; border:none; border-bottom:1px solid var(--line); color:var(--steel-bright); font-size:15px; padding:10px 0; outline:none; transition:border-color .3s ease; }
  .field input:focus{ border-color:var(--steel-bright); }
  .field input:focus + label, .field input:not(:placeholder-shown) + label{ transform:translateY(-19px); font-size:11px; color:var(--steel-bright); }
  .field input::placeholder{ color:transparent; }
  .extra{ max-height:0; opacity:0; overflow:hidden; transition:max-height .5s cubic-bezier(.4,0,.2,1), opacity .35s ease; }

  .row-between{ display:flex; justify-content:space-between; font-size:12px; color:var(--dim); margin:0 0 28px; }
  .row-between a{ color:var(--dim); text-decoration:none; border-bottom:1px solid var(--line); }
  .row-between a:hover{ color:var(--steel-bright); }
  .checkbox{ display:flex; align-items:center; gap:7px; }
  .checkbox input{ accent-color:var(--steel); width:13px; height:13px; }

  button.enter{
    position:relative; width:100%; background:none; border:1px solid var(--steel); color:var(--steel-bright); font-size:13.5px; font-weight:600;
    padding:14px; cursor:pointer; overflow:hidden; isolation:isolate; transition:color .4s ease .1s;
  }
  button.enter::before{ content:""; position:absolute; left:50%; top:50%; width:0; height:0; border-radius:50%; background:var(--steel-bright); transform:translate(-50%,-50%); transition:width .5s cubic-bezier(.65,0,.35,1), height .5s cubic-bezier(.65,0,.35,1); z-index:-1; }
  button.enter:hover{ color:#161819; }
  button.enter:hover::before{ width:340px; height:340px; }

  .divider{ display:flex; align-items:center; gap:14px; margin:24px 0; color:var(--dim); font-size:11px; }
  .divider::before,.divider::after{ content:""; flex:1; height:1px; background:var(--line); }
  button.ghost{ width:100%; background:none; border:1px solid var(--line); color:var(--steel-bright); font-size:13px; padding:12px; cursor:pointer; transition:border-color .2s ease; }
  button.ghost:hover{ border-color:var(--steel); }
  .foot{ text-align:center; font-size:12.5px; color:var(--dim); margin-top:22px; }
  .foot a{ color:var(--steel-bright); text-decoration:none; cursor:pointer; }
  .foot a:hover{ text-decoration:underline; }
</style>
</head>
<body>

<svg class="iris" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
  <g transform="translate(50 50)">
    <path class="blade" d="M0 0 L60 -10 A62 62 0 0 1 60 10 Z"/>
    <path class="blade" d="M0 0 L52 32 A62 62 0 0 1 32 52 Z"/>
    <path class="blade" d="M0 0 L-10 60 A62 62 0 0 1 -32 52 Z"/>
    <path class="blade" d="M0 0 L-60 10 A62 62 0 0 1 -60 -10 Z"/>
    <path class="blade" d="M0 0 L-32 -52 A62 62 0 0 1 -10 -60 Z"/>
    <path class="blade" d="M0 0 L32 -52 A62 62 0 0 1 52 -32 Z"/>
  </g>
</svg>

<div class="stage">
  <div class="brand">LUMEN OPTICS</div>
  <h1 id="heading">Sign in</h1>
  <p class="sub" id="subhead">Your prescriptions, orders, and fitting history.</p>

  <div class="panel">
    <div class="tabs" id="tabs">
      <button class="active" data-tab="signin" type="button">Sign in</button>
      <button data-tab="signup" type="button">Create account</button>
      <span class="tab-indicator" id="tabIndicator"></span>
    </div>

    <form onsubmit="return false;">
      <div class="field extra" id="nameField">
        <input type="text" placeholder=" " id="nameInput" autocomplete="name" />
        <label for="nameInput">Full name</label>
      </div>
      <div class="field">
        <input type="email" placeholder=" " id="emailInput" required autocomplete="email" />
        <label for="emailInput">Email address</label>
      </div>
      <div class="field">
        <input type="password" placeholder=" " id="pwInput" required autocomplete="current-password" class="has-eye" style="padding-right:34px;" />
        <label for="pwInput">Password</label>
        <button type="button" class="eye-btn" data-for="pwInput" aria-label="Show password" aria-pressed="false" style="position:absolute; right:2px; bottom:6px; background:none; border:none; padding:5px; cursor:pointer; color:var(--dim);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="15" height="15"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <div class="row-between" id="signinOnlyRow">
        <label class="checkbox"><input type="checkbox" /> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>
      <button class="enter" type="submit"><span id="submitLabel">Sign in</span></button>
    </form>

    <div class="divider">or continue with</div>
    <button class="ghost" type="button">Google</button>

    <p class="foot" id="footNote">New here? <a data-switch="signup">Create an account</a></p>
  </div>
</div>

<script>
(function(){
  document.querySelectorAll('.eye-btn').forEach(function(btn){
    var input = document.getElementById(btn.dataset.for);
    var showing = false;
    btn.addEventListener('click', function(){
      showing = !showing;
      input.type = showing ? 'text' : 'password';
      btn.setAttribute('aria-pressed', showing ? 'true' : 'false');
      btn.setAttribute('aria-label', showing ? 'Hide password' : 'Show password');
    });
  });

  var tabs = document.querySelectorAll('#tabs button[data-tab]');
  var indicator = document.getElementById('tabIndicator');
  var nameField = document.getElementById('nameField');
  var signinOnlyRow = document.getElementById('signinOnlyRow');
  var heading = document.getElementById('heading');
  var subhead = document.getElementById('subhead');
  var submitLabel = document.getElementById('submitLabel');
  var footNote = document.getElementById('footNote');

  var COPY = {
    signin: { heading:'Sign in', sub:'Your prescriptions, orders, and fitting history.', submit:'Sign in', foot:'New here? <a data-switch="signup">Create an account</a>' },
    signup: { heading:'Create your account', sub:'Save your prescription for faster reordering.', submit:'Create account', foot:'Already have an account? <a data-switch="signin">Sign in</a>' }
  };
  function positionIndicator(el){ indicator.style.width = el.offsetWidth+'px'; indicator.style.transform = 'translateX('+el.offsetLeft+'px)'; }
  function bindSwitchLinks(){ document.querySelectorAll('[data-switch]').forEach(function(a){ a.addEventListener('click', function(e){ e.preventDefault(); setMode(a.getAttribute('data-switch')); }); }); }
  function setMode(mode){
    tabs.forEach(function(t){ t.classList.toggle('active', t.dataset.tab===mode); if(t.dataset.tab===mode) positionIndicator(t); });
    var showExtra = mode==='signup';
    nameField.style.maxHeight = showExtra ? nameField.scrollHeight+'px' : '0px';
    nameField.style.opacity = showExtra?1:0;
    signinOnlyRow.style.display = mode==='signin' ? 'flex' : 'none';
    heading.textContent = COPY[mode].heading;
    subhead.textContent = COPY[mode].sub;
    submitLabel.textContent = COPY[mode].submit;
    footNote.innerHTML = COPY[mode].foot;
    bindSwitchLinks();
  }
  tabs.forEach(function(t){ t.addEventListener('click', function(){ setMode(t.dataset.tab); }); });
  bindSwitchLinks();
  window.addEventListener('load', function(){ positionIndicator(document.querySelector('#tabs button.active')); });
  window.addEventListener('message', function(e){ if(e.data && e.data.type==='loginkit-accent'){ document.documentElement.style.setProperty('--steel-bright', e.data.color); } });
})();
</script>

</body>
</html>
