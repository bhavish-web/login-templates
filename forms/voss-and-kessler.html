<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Voss &amp; Kessler — Client Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --blueprint:#0d1b2e; --card:#122238; --line-blue:#3a5a80; --cream:#e8eef5; --dim:#6f8aa8; --accent:#c7d4e2;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--blueprint); color:var(--cream); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:60px 24px; position:relative; overflow:hidden;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:0;
    background-image: repeating-linear-gradient(0deg, rgba(122,161,204,0.06) 0 1px, transparent 1px 40px), repeating-linear-gradient(90deg, rgba(122,161,204,0.06) 0 1px, transparent 1px 40px);
  }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  :focus-visible{ outline:1px solid var(--accent); outline-offset:2px; }

  .draft-frame{ position:fixed; top:60px; left:60px; right:60px; bottom:60px; pointer-events:none; z-index:0; }
  .draft-frame line{ stroke:var(--accent); stroke-width:1; stroke-dasharray:1200; stroke-dashoffset:1200; animation:draft 1.4s cubic-bezier(.65,0,.35,1) forwards; }
  .draft-frame line:nth-child(2){ animation-delay:.15s; } .draft-frame line:nth-child(3){ animation-delay:.3s; } .draft-frame line:nth-child(4){ animation-delay:.45s; }
  @keyframes draft{ to{ stroke-dashoffset:0; } }

  .stage{ position:relative; z-index:1; width:100%; max-width:380px; text-align:center;
    opacity:0; animation:fadeIn .5s ease forwards; animation-delay:.6s; }
  @keyframes fadeIn{ to{ opacity:1; } }

  .brand{ font-size:11px; letter-spacing:.2em; color:var(--accent); margin-bottom:6px; }
  .subbrand{ font-size:10px; letter-spacing:.1em; color:var(--dim); margin-bottom:20px; }
  h1{ font-family:'Fraunces', serif; font-weight:600; font-size:25px; margin-bottom:8px; }
  .sub{ font-size:13px; color:var(--dim); margin-bottom:30px; }

  .panel{ text-align:left; background:var(--card); border:1px solid var(--line-blue); padding:36px 32px; }

  .field{ position:relative; margin-bottom:24px; }
  .field label{ display:block; font-size:11px; letter-spacing:.04em; color:var(--dim); margin-bottom:8px; }
  .field input{ width:100%; background:none; border:none; border-bottom:1px solid var(--line-blue); color:var(--cream); font-size:15px; padding:9px 32px 9px 0; outline:none; transition:border-color .3s ease; }
  .field input:focus{ border-color:var(--accent); }
  .field input::placeholder{ color:var(--dim); opacity:.5; }
  .eye-btn{ position:absolute; right:2px; bottom:6px; background:none; border:none; padding:5px; cursor:pointer; color:var(--dim); display:flex; }
  .eye-btn:hover{ color:var(--accent); }
  .eye-btn svg{ width:15px; height:15px; }

  .row-between{ display:flex; justify-content:space-between; font-size:12px; color:var(--dim); margin:0 0 26px; }
  .row-between a{ color:var(--dim); text-decoration:none; border-bottom:1px solid var(--line-blue); }
  .row-between a:hover{ color:var(--accent); }
  .checkbox{ display:flex; align-items:center; gap:7px; }
  .checkbox input{ accent-color:var(--accent); width:13px; height:13px; }

  button.enter{ width:100%; background:none; border:1px solid var(--accent); color:var(--accent); font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; padding:13px; cursor:pointer; transition:background .3s ease, color .3s ease; }
  button.enter:hover{ background:var(--accent); color:var(--blueprint); }
  button.enter:active{ transform:scale(.99); }

  .foot{ text-align:center; font-size:12px; color:var(--dim); margin-top:24px; line-height:1.6; }
  .foot a{ color:var(--accent); text-decoration:none; }
  .foot a:hover{ text-decoration:underline; }
</style>
</head>
<body>

<svg class="draft-frame" width="100%" height="100%">
  <line x1="0" y1="0" x2="100%" y2="0"/><line x1="100%" y1="0" x2="100%" y2="100%"/>
  <line x1="100%" y1="100%" x2="0" y2="100%"/><line x1="0" y1="100%" x2="0" y2="0"/>
</svg>

<div class="stage">
  <div class="brand">VOSS &amp; KESSLER</div>
  <div class="subbrand">ARCHITECTURE — STRUCTURE — INTERIORS</div>
  <h1>Client sign in</h1>
  <p class="sub">Drawings, schedules, and site progress.</p>

  <div class="panel">
    <form onsubmit="return false;">
      <div class="field">
        <label for="emailInput">Email address</label>
        <input type="email" id="emailInput" placeholder="you@company.com" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="pwInput">Password</label>
        <input type="password" id="pwInput" placeholder="••••••••••••" required autocomplete="current-password" class="has-eye" />
        <button type="button" class="eye-btn" data-for="pwInput" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <div class="row-between">
        <label class="checkbox"><input type="checkbox" /> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>
      <button class="enter" type="submit">Sign In</button>
    </form>
  </div>

  <p class="foot">Access is provisioned per project.<br/><a href="#">Contact your project lead</a></p>
</div>

<script>
(function(){
  document.querySelectorAll('.eye-btn').forEach(function(btn){
    var input = document.getElementById(btn.dataset.for);
    var showing = false;
    btn.addEventListener('click', function(){
      showing = !showing;
      input.type = showing ? 'text' : 'password';
      btn.setAttribute('aria-pressed', showing ? 'true' : 'false');
      btn.setAttribute('aria-label', showing ? 'Hide password' : 'Show password');
    });
  });
  window.addEventListener('message', function(e){ if(e.data && e.data.type==='loginkit-accent'){ document.documentElement.style.setProperty('--accent', e.data.color); } });
})();
</script>

</body>
</html>
