<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blackwood Auctions — Bidder Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0c0c0c; --card:#151515; --gold:#a8873f; --gold-bright:#c9a75f; --line:rgba(168,135,63,0.16); --cream:#eeece6; --dim:#8a8578;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--ink); color:var(--cream); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:60px 24px;
  }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  :focus-visible{ outline:1px solid var(--gold-bright); outline-offset:2px; }

  .stage{ width:100%; max-width:380px; text-align:center; }

  .gavel-wrap{ display:flex; justify-content:center; margin-bottom:16px; height:50px; align-items:flex-end; }
  .gavel{ width:44px; height:44px; transform-origin:80% 20%; animation:strike .5s cubic-bezier(.5,0,.3,1.3) forwards; animation-delay:.1s; }
  @keyframes strike{ 0%{ transform:rotate(-45deg) translateY(-10px); } 55%{ transform:rotate(6deg) translateY(2px); } 100%{ transform:rotate(0deg) translateY(0); } }
  .gavel path{ fill:none; stroke:var(--gold); stroke-width:2; stroke-linecap:round; }
  .strike-mark{ width:24px; height:2px; background:var(--gold-bright); margin:0 auto; opacity:0; animation:markIn .3s ease forwards; animation-delay:.5s; }
  @keyframes markIn{ to{ opacity:.6; } }

  .brand{ font-size:11px; letter-spacing:.24em; color:var(--gold); margin-bottom:16px;
    opacity:0; animation:fadeUp .6s cubic-bezier(.16,1,.3,1) forwards; animation-delay:.6s; }
  h1{ font-family:'Playfair Display', serif; font-weight:600; font-size:26px; margin-bottom:8px;
    opacity:0; animation:fadeUp .6s cubic-bezier(.16,1,.3,1) forwards; animation-delay:.66s; }
  .sub{ font-size:13px; color:var(--dim); margin-bottom:32px;
    opacity:0; animation:fadeUp .6s cubic-bezier(.16,1,.3,1) forwards; animation-delay:.72s; }
  @keyframes fadeUp{ to{ opacity:1; transform:none; } }
  h1, .sub{ transform:translateY(6px); }

  .panel{ text-align:left; background:var(--card); border:1px solid var(--line); padding:36px 32px;
    opacity:0; animation:fadeUp .7s cubic-bezier(.16,1,.3,1) forwards; animation-delay:.78s; }

  .field{ position:relative; margin-bottom:24px; }
  .field label{ display:block; font-size:11px; letter-spacing:.04em; color:var(--dim); margin-bottom:8px; }
  .field input{ width:100%; background:none; border:none; border-bottom:1px solid var(--line); color:var(--cream); font-size:15px; padding:9px 32px 9px 0; outline:none; transition:border-color .3s ease; }
  .field input:focus{ border-color:var(--gold); }
  .field input::placeholder{ color:var(--dim); opacity:.5; }
  .extra{ max-height:0; opacity:0; overflow:hidden; transition:max-height .5s cubic-bezier(.4,0,.2,1), opacity .35s ease; }
  .eye-btn{ position:absolute; right:2px; bottom:6px; background:none; border:none; padding:5px; cursor:pointer; color:var(--dim); display:flex; }
  .eye-btn:hover{ color:var(--gold-bright); }
  .eye-btn svg{ width:15px; height:15px; }

  .row-between{ display:flex; justify-content:space-between; font-size:12px; color:var(--dim); margin:0 0 26px; }
  .row-between a{ color:var(--dim); text-decoration:none; border-bottom:1px solid var(--line); }
  .row-between a:hover{ color:var(--gold-bright); }
  .checkbox{ display:flex; align-items:center; gap:7px; }
  .checkbox input{ accent-color:var(--gold); width:13px; height:13px; }

  button.enter{ width:100%; background:var(--gold); border:none; color:#0c0c0c; font-size:13.5px; font-weight:600; padding:13px; cursor:pointer; transition:background .25s ease, transform .1s ease; }
  button.enter:hover{ background:var(--gold-bright); }
  button.enter:active{ transform:scale(.99); }

  .foot{ text-align:center; font-size:12.5px; color:var(--dim); margin-top:22px; }
  .foot a{ color:var(--gold-bright); text-decoration:none; cursor:pointer; }
  .foot a:hover{ text-decoration:underline; }
</style>
</head>
<body>

<div class="stage">
  <div class="gavel-wrap">
    <svg class="gavel" viewBox="0 0 44 44"><path d="M10 10 L28 28 M6 24 L20 10 M24 30 L34 40"/></svg>
  </div>
  <div class="strike-mark"></div>

  <div class="brand">BLACKWOOD AUCTIONS</div>
  <h1 id="heading">Bidder sign in</h1>
  <p class="sub" id="subhead">Your paddle, watchlist, and bid history.</p>

  <div class="panel">
    <form onsubmit="return false;">
      <div class="field extra" id="nameField">
        <label for="nameInput">Full name</label>
        <input type="text" id="nameInput" placeholder="Jordan Rivera" autocomplete="name" />
      </div>
      <div class="field">
        <label for="emailInput">Email address</label>
        <input type="email" id="emailInput" placeholder="you@company.com" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="pwInput">Password</label>
        <input type="password" id="pwInput" placeholder="••••••••••••" required autocomplete="current-password" class="has-eye" />
        <button type="button" class="eye-btn" data-for="pwInput" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <div class="row-between" id="signinOnlyRow">
        <label class="checkbox"><input type="checkbox" /> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>
      <button class="enter" type="submit"><span id="submitLabel">Sign in</span></button>
    </form>

    <p class="foot" id="footNote">New bidder? <a data-switch="signup">Register a paddle</a></p>
  </div>
</div>

<script>
(function(){
  document.querySelectorAll('.eye-btn').forEach(function(btn){
    var input = document.getElementById(btn.dataset.for);
    var showing = false;
    btn.addEventListener('click', function(){
      showing = !showing;
      input.type = showing ? 'text' : 'password';
      btn.setAttribute('aria-pressed', showing ? 'true' : 'false');
      btn.setAttribute('aria-label', showing ? 'Hide password' : 'Show password');
    });
  });

  var nameField = document.getElementById('nameField');
  var heading = document.getElementById('heading');
  var subhead = document.getElementById('subhead');
  var submitLabel = document.getElementById('submitLabel');
  var footNote = document.getElementById('footNote');
  var signinOnlyRow = document.getElementById('signinOnlyRow');
  var mode = 'signin';

  var COPY = {
    signin: { heading:'Bidder sign in', sub:'Your paddle, watchlist, and bid history.', submit:'Sign in', foot:'New bidder? <a data-switch="signup">Register a paddle</a>' },
    signup: { heading:'Register a paddle', sub:'Verification is required before your first bid.', submit:'Register', foot:'Already registered? <a data-switch="signin">Sign in</a>' }
  };
  function bindSwitchLinks(){ document.querySelectorAll('[data-switch]').forEach(function(a){ a.addEventListener('click', function(e){ e.preventDefault(); setMode(a.getAttribute('data-switch')); }); }); }
  function setMode(m){
    mode = m;
    var showExtra = mode==='signup';
    nameField.style.maxHeight = showExtra ? nameField.scrollHeight+'px' : '0px';
    nameField.style.opacity = showExtra?1:0;
    signinOnlyRow.style.display = mode==='signin' ? 'flex' : 'none';
    heading.textContent = COPY[mode].heading;
    subhead.textContent = COPY[mode].sub;
    submitLabel.textContent = COPY[mode].submit;
    footNote.innerHTML = COPY[mode].foot;
    bindSwitchLinks();
  }
  bindSwitchLinks();
  window.addEventListener('message', function(e){ if(e.data && e.data.type==='loginkit-accent'){ document.documentElement.style.setProperty('--gold', e.data.color); } });
})();
</script>

</body>
</html>
