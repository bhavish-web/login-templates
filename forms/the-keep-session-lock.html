<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Keep — Session Locked</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#122019; --card:#f6f1e6; --line:#ddccae;
    --gold:#8a6a35; --ink:#241a16; --dim:#8a7458;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--forest); color:var(--ink); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:60px 24px;
  }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  :focus-visible{ outline:1px solid var(--gold); outline-offset:2px; }

  .card{
    width:100%; max-width:360px; background:var(--card); border-radius:3px; padding:44px 36px; text-align:center;
    box-shadow:0 40px 90px -30px rgba(0,0,0,0.6);
    opacity:0; transform:translateY(16px) scale(.98); animation:reveal .85s cubic-bezier(.16,1,.3,1) forwards; animation-delay:.15s;
  }
  @keyframes reveal{ to{ opacity:1; transform:none; } }

  .avatar{
    width:64px; height:64px; border-radius:50%; margin:0 auto 18px; background:linear-gradient(160deg, #2d4a3a, #122019);
    display:flex; align-items:center; justify-content:center; font-family:'Fraunces', serif; font-size:24px; color:#e8dfc8;
    border:2px solid var(--line);
  }
  .name{ font-family:'Fraunces', serif; font-weight:600; font-size:19px; margin-bottom:4px; }
  .email{ font-size:12.5px; color:var(--dim); margin-bottom:28px; }

  .field{ position:relative; margin-bottom:8px; text-align:left; }
  .field label{ display:block; font-size:11px; letter-spacing:.04em; color:var(--dim); margin-bottom:7px; }
  .field input{ width:100%; background:#fffdf8; border:1.5px solid var(--line); color:var(--ink); font-size:15px; padding:11px 34px 11px 12px; border-radius:3px; outline:none; transition:border-color .2s ease; }
  .field input:focus{ border-color:var(--gold); }
  .eye-btn{ position:absolute; right:2px; bottom:6px; background:none; border:none; padding:5px; cursor:pointer; color:var(--dim); display:flex; align-items:center; justify-content:center; }
  .eye-btn:hover{ color:var(--gold); }
  .eye-btn svg{ width:15px; height:15px; }

  .error-msg{ font-size:12px; color:#b5453a; text-align:left; min-height:16px; margin:6px 0 14px; }

  button.enter{ width:100%; background:var(--ink); border:none; color:#fdf8ef; font-size:13.5px; font-weight:600; padding:14px; border-radius:3px; cursor:pointer; margin-top:8px; transition:background .25s ease, transform .1s ease; }
  button.enter:hover{ background:#3a281f; }
  button.enter:active{ transform:scale(.99); }

  .alt{ margin-top:22px; display:flex; flex-direction:column; gap:10px; }
  .alt button{ background:none; border:1px solid var(--line); color:var(--ink); font-size:12.5px; padding:10px; border-radius:3px; cursor:pointer; transition:border-color .2s ease; }
  .alt button:hover{ border-color:var(--gold); }
  .switch{ margin-top:18px; font-size:12px; color:var(--dim); }
  .switch a{ color:var(--gold); text-decoration:none; }
  .switch a:hover{ text-decoration:underline; }
</style>
</head>
<body>

<div class="card">
  <div class="avatar">JR</div>
  <div class="name">Welcome back, Jordan</div>
  <div class="email">jordan.rivera@company.com</div>

  <form onsubmit="return false;" id="lockForm">
    <div class="field">
      <label for="pwInput">Password</label>
      <input type="password" id="pwInput" placeholder="Enter your password" required autocomplete="current-password" class="has-eye" />
      <button type="button" class="eye-btn" id="eyeBtn" aria-label="Show password" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <p class="error-msg" id="errorMsg"></p>
    <button class="enter" type="submit">Unlock</button>
  </form>

  <div class="alt">
    <button type="button">Use a passkey instead</button>
  </div>

  <p class="switch">Not Jordan? <a href="#">Sign in as someone else</a></p>
</div>

<script>
(function(){
  var eyeBtn = document.getElementById('eyeBtn');
  var pwInput = document.getElementById('pwInput');
  var showing = false;
  eyeBtn.addEventListener('click', function(){
    showing = !showing;
    pwInput.type = showing ? 'text' : 'password';
    eyeBtn.setAttribute('aria-pressed', showing ? 'true' : 'false');
    eyeBtn.setAttribute('aria-label', showing ? 'Hide password' : 'Show password');
  });

  document.getElementById('lockForm').addEventListener('submit', function(){
    document.getElementById('errorMsg').textContent = '';
  });

  window.addEventListener('message', function(e){
    if(e.data && e.data.type === 'loginkit-accent'){
      document.documentElement.style.setProperty('--gold', e.data.color);
    }
  });
})();
</script>

</body>
</html>
