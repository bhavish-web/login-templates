<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marbleworks — Studio Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --stone:#f2f0ec; --card:#ffffff; --line:#dcd8d0; --verdigris:#4f7a70; --verdigris-bright:#6b9c8f;
    --ink:#242220; --dim:#82796f;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--stone); color:var(--ink); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:60px 24px; overflow:hidden;
  }

  .seam-wrap{ position:relative; width:100%; max-width:400px; }
  .seam-top, .seam-bottom{
    position:relative; background:var(--card); border:1px solid var(--line);
    animation:none;
  }
  .seam-top{ padding:44px 38px 24px; border-bottom:none; transform:translateY(0); animation:openUp .7s cubic-bezier(.65,0,.35,1) forwards; animation-delay:.15s; }
  .seam-bottom{ padding:24px 38px 40px; border-top:none; animation:openDown .7s cubic-bezier(.65,0,.35,1) forwards; animation-delay:.15s; }
  @keyframes openUp{ from{ transform:translateY(40px); } to{ transform:translateY(0); } }
  @keyframes openDown{ from{ transform:translateY(-40px); } to{ transform:translateY(0); } }
  .seam-wrap{ opacity:0; animation:fadeIn .3s ease forwards; }
  @keyframes fadeIn{ to{ opacity:1; } }

  .seam-line{ height:1px; background:linear-gradient(90deg, transparent, var(--verdigris), transparent);
    transform:scaleX(0); animation:growSeam .6s cubic-bezier(.65,0,.35,1) forwards; animation-delay:.75s; }
  @keyframes growSeam{ to{ transform:scaleX(1); } }

  .brand{ font-size:11px; letter-spacing:.18em; color:var(--verdigris); margin-bottom:16px;
    opacity:0; animation:fadeUp .6s cubic-bezier(.16,1,.3,1) forwards; animation-delay:.5s; }
  h1{ font-family:'Fraunces', serif; font-weight:600; font-size:27px; margin-bottom:8px;
    opacity:0; animation:fadeUp .6s cubic-bezier(.16,1,.3,1) forwards; animation-delay:.56s; }
  .sub{ font-size:13.5px; color:var(--dim); margin-bottom:8px;
    opacity:0; animation:fadeUp .6s cubic-bezier(.16,1,.3,1) forwards; animation-delay:.6s; }
  @keyframes fadeUp{ to{ opacity:1; transform:none; } }
  .brand, h1, .sub{ transform:translateY(6px); }

  .tabs{ position:relative; display:flex; gap:24px; margin-top:26px; border-bottom:1px solid var(--line);
    opacity:0; animation:fadeUp .6s cubic-bezier(.16,1,.3,1) forwards; animation-delay:.85s; }
  .tabs button{ background:none; border:none; color:var(--dim); font-size:12.5px; font-weight:500; padding:0 0 12px; cursor:pointer; transition:color .3s ease; }
  .tabs button.active{ color:var(--verdigris); }
  .tab-indicator{ position:absolute; bottom:-1px; height:2px; background:var(--verdigris); transition:transform .5s cubic-bezier(.65,0,.35,1), width .5s cubic-bezier(.65,0,.35,1); }

  form{ opacity:0; animation:fadeUp .6s cubic-bezier(.16,1,.3,1) forwards; animation-delay:.95s; margin-top:24px; }

  .field{ position:relative; margin-bottom:24px; }
  .field label{ position:absolute; left:0; top:11px; font-size:14px; color:var(--dim); pointer-events:none; transition:transform .3s cubic-bezier(.4,0,.2,1), font-size .3s ease, color .3s ease; transform-origin:left top; }
  .field input{ width:100%; background:none; border:none; border-bottom:1px solid var(--line); color:var(--ink); font-size:15px; padding:10px 0; outline:none; transition:border-color .3s ease; }
  .field .underline-accent{ position:absolute; left:0; right:0; bottom:-1px; height:1.5px; background:var(--verdigris); transform:scaleX(0); transition:transform .4s cubic-bezier(.65,0,.35,1); }
  .field input:focus ~ .underline-accent{ transform:scaleX(1); }
  .field input:focus{ border-color:transparent; }
  .field input:focus + label, .field input:not(:placeholder-shown) + label{ transform:translateY(-19px); font-size:11px; color:var(--verdigris); }
  .field input::placeholder{ color:transparent; }
  .extra{ max-height:0; opacity:0; overflow:hidden; transition:max-height .5s cubic-bezier(.4,0,.2,1), opacity .35s ease; }

  .row-between{ display:flex; justify-content:space-between; font-size:12px; color:var(--dim); margin:0 0 28px; }
  .row-between a{ color:var(--dim); text-decoration:none; border-bottom:1px solid var(--line); }
  .row-between a:hover{ color:var(--verdigris); }
  .checkbox{ display:flex; align-items:center; gap:7px; }
  .checkbox input{ accent-color:var(--verdigris); width:13px; height:13px; }

  button.enter{ position:relative; width:100%; background:var(--ink); border:none; color:var(--stone); font-size:13.5px; font-weight:600; padding:14px; cursor:pointer; overflow:hidden; transition:transform .1s ease; }
  button.enter::before{ content:""; position:absolute; inset:0; background:var(--verdigris); transform:translateX(-100%); transition:transform .45s cubic-bezier(.65,0,.35,1); }
  button.enter span{ position:relative; }
  button.enter:hover::before{ transform:translateX(0); }
  button.enter:active{ transform:scale(.99); }

  .divider{ display:flex; align-items:center; gap:14px; margin:24px 0; color:var(--dim); font-size:11px; }
  .divider::before,.divider::after{ content:""; flex:1; height:1px; background:var(--line); }
  button.ghost{ width:100%; background:none; border:1px solid var(--line); color:var(--ink); font-size:13px; padding:12px; cursor:pointer; transition:border-color .2s ease; }
  button.ghost:hover{ border-color:var(--verdigris); }

  .foot{ text-align:center; font-size:12.5px; color:var(--dim); margin-top:22px; }
  .foot a{ color:var(--verdigris); text-decoration:none; cursor:pointer; font-weight:600; }
  .foot a:hover{ text-decoration:underline; }
  :focus-visible{ outline:1px solid var(--verdigris); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }
</style>
</head>
<body>

<div class="seam-wrap">
  <div class="seam-top">
    <div class="brand">MARBLEWORKS STUDIO</div>
    <h1 id="heading">Studio sign in</h1>
    <p class="sub" id="subhead">Drawings, schedules, and site notes.</p>
  </div>
  <div class="seam-line"></div>
  <div class="seam-bottom">
    <div class="tabs" id="tabs">
      <button class="active" data-tab="signin" type="button">Sign in</button>
      <button data-tab="signup" type="button">Create account</button>
      <span class="tab-indicator" id="tabIndicator"></span>
    </div>

    <form onsubmit="return false;">
      <div class="field extra" id="nameField">
        <input type="text" placeholder=" " id="nameInput" />
        <label for="nameInput">Full name</label>
        <span class="underline-accent"></span>
      </div>
      <div class="field">
        <input type="email" placeholder=" " id="emailInput" required />
        <label for="emailInput">Email address</label>
        <span class="underline-accent"></span>
      </div>
      <div class="field">
        <input type="password" placeholder=" " id="pwInput" required />
        <label for="pwInput">Password</label>
        <span class="underline-accent"></span>
      </div>
      <div class="field extra" id="confirmField">
        <input type="password" placeholder=" " id="confirmInput" />
        <label for="confirmInput">Confirm password</label>
        <span class="underline-accent"></span>
      </div>
      <div class="row-between" id="signinOnlyRow">
        <label class="checkbox"><input type="checkbox" /> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>
      <button class="enter" type="submit"><span id="submitLabel">Sign in</span></button>
    </form>

    <div class="divider">or continue with</div>
    <button class="ghost" type="button">Google</button>

    <p class="foot" id="footNote">New to the studio? <a data-switch="signup">Create an account</a></p>
  </div>
</div>

<script>
(function(){
  var tabs = document.querySelectorAll('#tabs button[data-tab]');
  var indicator = document.getElementById('tabIndicator');
  var nameField = document.getElementById('nameField');
  var confirmField = document.getElementById('confirmField');
  var signinOnlyRow = document.getElementById('signinOnlyRow');
  var heading = document.getElementById('heading');
  var subhead = document.getElementById('subhead');
  var submitLabel = document.getElementById('submitLabel');
  var footNote = document.getElementById('footNote');

  var COPY = {
    signin: { heading:'Studio sign in', sub:'Drawings, schedules, and site notes.', submit:'Sign in', foot:'New to the studio? <a data-switch="signup">Create an account</a>' },
    signup: { heading:'Create your account', sub:'Set up studio access in under a minute.', submit:'Create account', foot:'Already have an account? <a data-switch="signin">Sign in</a>' }
  };

  function positionIndicator(el){ indicator.style.width = el.offsetWidth+'px'; indicator.style.transform = 'translateX('+el.offsetLeft+'px)'; }
  function bindSwitchLinks(){ document.querySelectorAll('[data-switch]').forEach(function(a){ a.addEventListener('click', function(e){ e.preventDefault(); setMode(a.getAttribute('data-switch')); }); }); }

  function setMode(mode){
    tabs.forEach(function(t){ t.classList.toggle('active', t.dataset.tab===mode); if(t.dataset.tab===mode) positionIndicator(t); });
    var showExtra = mode==='signup';
    [nameField, confirmField].forEach(function(f){ f.style.maxHeight = showExtra ? f.scrollHeight+'px' : '0px'; f.style.opacity = showExtra?1:0; });
    signinOnlyRow.style.display = mode==='signin' ? 'flex' : 'none';
    heading.textContent = COPY[mode].heading;
    subhead.textContent = COPY[mode].sub;
    submitLabel.textContent = COPY[mode].submit;
    footNote.innerHTML = COPY[mode].foot;
    bindSwitchLinks();
  }
  tabs.forEach(function(t){ t.addEventListener('click', function(){ setMode(t.dataset.tab); }); });
  bindSwitchLinks();
  window.addEventListener('load', function(){ positionIndicator(document.querySelector('#tabs button.active')); });
  window.addEventListener('message', function(e){ if(e.data && e.data.type==='loginkit-accent'){ document.documentElement.style.setProperty('--verdigris', e.data.color); } });
})();
</script>

</body>
</html>
