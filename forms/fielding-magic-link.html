<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fielding &amp; Co. — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --linen:#f7f1e4; --card:#fffdf8; --line:#ddccae; --terracotta:#b5552e; --terracotta-bright:#d47245;
    --ink:#241a16; --dim:#8a7458;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--linen); color:var(--ink); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:60px 24px;
  }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  :focus-visible{ outline:1px solid var(--terracotta); outline-offset:2px; }

  .card{
    width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:3px; padding:44px 38px;
    box-shadow:0 30px 70px -34px rgba(110,60,35,0.3);
    opacity:0; transform:translateY(14px); animation:reveal .85s cubic-bezier(.16,1,.3,1) forwards; animation-delay:.1s;
  }
  @keyframes reveal{ to{ opacity:1; transform:none; } }

  .mark{ font-size:11px; letter-spacing:.2em; color:var(--terracotta); margin-bottom:20px; }

  .view{ display:block; }
  .view[hidden]{ display:none; }

  h1{ font-family:'Fraunces', serif; font-weight:600; font-size:27px; margin-bottom:8px; }
  .sub{ font-size:13.5px; color:var(--dim); margin-bottom:30px; line-height:1.5; }

  .field{ margin-bottom:22px; }
  .field label{ display:block; font-size:11px; letter-spacing:.04em; color:var(--dim); margin-bottom:7px; }
  .field input{ width:100%; background:none; border:none; border-bottom:1.5px solid var(--line); color:var(--ink); font-size:16px; padding:10px 0; outline:none; transition:border-color .25s ease; }
  .field input:focus{ border-color:var(--terracotta); }

  button.enter{ position:relative; width:100%; background:var(--terracotta); border:none; color:#fdf6ee; font-family:'Fraunces', serif; font-style:italic; font-weight:600; font-size:17px; padding:14px; border-radius:3px; cursor:pointer; overflow:hidden; transition:background .25s ease, transform .1s ease; }
  button.enter:hover{ background:var(--terracotta-bright); }
  button.enter:active{ transform:scale(.99); }

  .foot{ text-align:center; font-size:12.5px; color:var(--dim); margin-top:26px; }
  .foot a{ color:var(--terracotta); text-decoration:none; font-weight:600; }
  .foot a:hover{ text-decoration:underline; }

  /* success state */
  .icon-wrap{ display:flex; justify-content:center; margin-bottom:22px; }
  .icon-wrap svg{ width:52px; height:52px; }
  .icon-wrap circle{ fill:none; stroke:var(--line); stroke-width:1.5; }
  .icon-wrap path{ fill:none; stroke:var(--terracotta); stroke-width:2; stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:24; stroke-dashoffset:24; animation:draw .5s ease forwards; animation-delay:.3s; }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  .success h1{ text-align:center; }
  .success .sub{ text-align:center; }
  .success .sub b{ color:var(--ink); }
  .resend-line{ text-align:center; font-size:12.5px; color:var(--dim); margin-top:24px; }
  .resend-line button{ background:none; border:none; color:var(--terracotta); font-size:12.5px; cursor:pointer; text-decoration:underline; padding:0; }
</style>
</head>
<body>

<div class="card">
  <div class="mark">FIELDING &amp; CO.</div>

  <div class="view" id="requestView">
    <h1>Sign in without a password</h1>
    <p class="sub">We'll email you a one-time link — no password to remember or leak.</p>
    <form id="magicForm" onsubmit="return false;">
      <div class="field">
        <label for="emailInput">Email address</label>
        <input type="email" id="emailInput" placeholder="you@company.com" required autocomplete="email" />
      </div>
      <button class="enter" type="submit">Send magic link</button>
    </form>
    <p class="foot">Prefer a password? <a href="#">Use one instead</a></p>
  </div>

  <div class="view success" id="sentView" hidden>
    <div class="icon-wrap">
      <svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="24"/><path d="M15 27l7 7 15-15"/></svg>
    </div>
    <h1>Check your inbox</h1>
    <p class="sub">We sent a sign-in link to <b id="sentEmail">you@company.com</b>. It expires in 15 minutes.</p>
    <p class="resend-line">Didn't get it? <button type="button" id="resendBtn">Resend link</button></p>
  </div>
</div>

<script>
(function(){
  var form = document.getElementById('magicForm');
  var requestView = document.getElementById('requestView');
  var sentView = document.getElementById('sentView');
  var emailInput = document.getElementById('emailInput');
  var sentEmail = document.getElementById('sentEmail');
  var resendBtn = document.getElementById('resendBtn');

  form.addEventListener('submit', function(){
    sentEmail.textContent = emailInput.value || 'you@company.com';
    requestView.hidden = true;
    sentView.hidden = false;
  });

  resendBtn.addEventListener('click', function(){
    resendBtn.textContent = 'Link resent ✓';
    resendBtn.disabled = true;
    setTimeout(function(){
      resendBtn.textContent = 'Resend link';
      resendBtn.disabled = false;
    }, 3000);
  });

  window.addEventListener('message', function(e){
    if(e.data && e.data.type === 'loginkit-accent'){
      document.documentElement.style.setProperty('--terracotta', e.data.color);
    }
  });
})();
</script>

</body>
</html>
