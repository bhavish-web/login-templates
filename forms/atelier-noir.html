<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Atelier Noir — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0d0d0d; --card:#151515; --line:rgba(255,255,255,0.1); --chalk:#f2efe9; --chalk-dim:#8f8b83;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--ink); color:var(--chalk); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;
    min-height:100vh; display:grid; grid-template-columns:1fr 1fr; overflow:hidden;
  }
  @media(max-width:860px){ body{ grid-template-columns:1fr; } .drape-side{ display:none; } }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  :focus-visible{ outline:1px solid var(--chalk); outline-offset:2px; }

  .drape-side{ position:relative; background:#000; overflow:hidden; }
  .drape{
    position:absolute; inset:-10%; background:linear-gradient(150deg, #1c1c1c, #050505 60%);
    clip-path:polygon(0 0, 100% 0, 100% 55%, 60% 70%, 100% 85%, 100% 100%, 0 100%);
    animation:drapeIn 1.4s cubic-bezier(.16,1,.3,1) forwards;
  }
  @keyframes drapeIn{
    from{ clip-path:polygon(0 0, 100% 0, 100% 0%, 60% 0%, 100% 0%, 100% 0%, 0 0%); }
    to{ clip-path:polygon(0 0, 100% 0, 100% 55%, 60% 70%, 100% 85%, 100% 100%, 0 100%); }
  }
  .drape-label{ position:absolute; bottom:50px; left:50px; font-family:'Cormorant Garamond', serif; font-style:italic; font-size:22px; color:var(--chalk-dim);
    opacity:0; animation:fadeIn .8s ease forwards; animation-delay:1.2s; }
  @keyframes fadeIn{ to{ opacity:1; } }

  .form-side{ display:flex; align-items:center; justify-content:center; padding:48px; }
  .panel{ width:100%; max-width:360px;
    opacity:0; transform:translateY(14px); animation:reveal .9s cubic-bezier(.16,1,.3,1) forwards; animation-delay:.2s; }
  @keyframes reveal{ to{ opacity:1; transform:none; } }

  .brand{ font-size:11px; letter-spacing:.28em; color:var(--chalk-dim); margin-bottom:26px; }
  h1{ font-family:'Cormorant Garamond', serif; font-weight:500; font-size:30px; margin-bottom:8px; }
  .sub{ font-size:13.5px; color:var(--chalk-dim); margin-bottom:32px; }

  .tabs{ display:flex; gap:26px; margin-bottom:30px; }
  .tabs button{ background:none; border:1px solid transparent; color:var(--chalk-dim); font-size:11px; letter-spacing:.1em; text-transform:uppercase; padding:0 0 8px; cursor:pointer; transition:color .3s ease, border-color .3s ease; }
  .tabs button.active{ color:var(--chalk); border-bottom-color:var(--chalk); }

  .field{ margin-bottom:22px; }
  .field label{ display:block; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--chalk-dim); margin-bottom:8px; }
  .field input{ width:100%; background:none; border:none; border-bottom:1px solid var(--line); color:var(--chalk); font-size:15px; padding:8px 32px 8px 0; outline:none; transition:border-color .3s ease; }
  .field input:focus{ border-color:var(--chalk); }
  .field input::placeholder{ color:var(--chalk-dim); opacity:.4; }
  .extra{ max-height:0; opacity:0; overflow:hidden; transition:max-height .5s cubic-bezier(.4,0,.2,1), opacity .35s ease; }
  .eye-btn{ position:absolute; right:2px; bottom:6px; background:none; border:none; padding:5px; cursor:pointer; color:var(--chalk-dim); display:flex; }
  .eye-btn:hover{ color:var(--chalk); }
  .eye-btn svg{ width:15px; height:15px; }

  .row-between{ display:flex; justify-content:space-between; font-size:12px; color:var(--chalk-dim); margin:0 0 30px; }
  .row-between a{ color:var(--chalk-dim); text-decoration:none; border-bottom:1px solid var(--line); }
  .row-between a:hover{ color:var(--chalk); }
  .checkbox{ display:flex; align-items:center; gap:7px; }
  .checkbox input{ accent-color:var(--chalk); width:13px; height:13px; }

  button.enter{
    width:100%; background:none; border:1px solid var(--chalk); color:var(--chalk); font-size:12px; font-weight:500;
    letter-spacing:.14em; text-transform:uppercase; padding:15px; cursor:pointer; transition:letter-spacing .35s ease, background .35s ease, color .35s ease;
  }
  button.enter:hover{ letter-spacing:.22em; background:var(--chalk); color:#0d0d0d; }
  button.enter:active{ letter-spacing:.14em; }

  .divider{ display:flex; align-items:center; gap:14px; margin:26px 0; color:var(--chalk-dim); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; }
  .divider::before,.divider::after{ content:""; flex:1; height:1px; background:var(--line); }
  button.ghost{ width:100%; background:none; border:1px solid var(--line); color:var(--chalk); font-size:13px; padding:12px; cursor:pointer; transition:border-color .2s ease; }
  button.ghost:hover{ border-color:var(--chalk); }
  .foot{ text-align:center; font-size:12px; color:var(--chalk-dim); margin-top:24px; }
  .foot a{ color:var(--chalk); text-decoration:none; cursor:pointer; border-bottom:1px solid var(--chalk); }
</style>
</head>
<body>

<div class="drape-side"><div class="drape"></div><div class="drape-label">Collection No. 12</div></div>

<div class="form-side">
  <div class="panel">
    <div class="brand">ATELIER NOIR</div>
    <h1 id="heading">Sign in</h1>
    <p class="sub" id="subhead">Private client access and fitting schedule.</p>

    <div class="tabs" id="tabs">
      <button class="active" data-tab="signin" type="button">Sign In</button>
      <button data-tab="signup" type="button">Register</button>
    </div>

    <form onsubmit="return false;">
      <div class="field extra" id="nameField" style="position:relative;">
        <label for="nameInput">Full name</label>
        <input type="text" id="nameInput" placeholder="Jordan Rivera" autocomplete="name" />
      </div>
      <div class="field" style="position:relative;">
        <label for="emailInput">Email address</label>
        <input type="email" id="emailInput" placeholder="you@company.com" required autocomplete="email" />
      </div>
      <div class="field" style="position:relative;">
        <label for="pwInput">Password</label>
        <input type="password" id="pwInput" placeholder="••••••••••••" required autocomplete="current-password" class="has-eye" />
        <button type="button" class="eye-btn" data-for="pwInput" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <div class="row-between" id="signinOnlyRow">
        <label class="checkbox"><input type="checkbox" /> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>
      <button class="enter" type="submit"><span id="submitLabel">Sign In</span></button>
    </form>

    <div class="divider">or continue with</div>
    <button class="ghost" type="button">Google</button>

    <p class="foot" id="footNote">New client? <a data-switch="signup">Register</a></p>
  </div>
</div>

<script>
(function(){
  document.querySelectorAll('.eye-btn').forEach(function(btn){
    var input = document.getElementById(btn.dataset.for);
    var showing = false;
    btn.addEventListener('click', function(){
      showing = !showing;
      input.type = showing ? 'text' : 'password';
      btn.setAttribute('aria-pressed', showing ? 'true' : 'false');
      btn.setAttribute('aria-label', showing ? 'Hide password' : 'Show password');
    });
  });

  var tabs = document.querySelectorAll('#tabs button[data-tab]');
  var nameField = document.getElementById('nameField');
  var signinOnlyRow = document.getElementById('signinOnlyRow');
  var heading = document.getElementById('heading');
  var subhead = document.getElementById('subhead');
  var submitLabel = document.getElementById('submitLabel');
  var footNote = document.getElementById('footNote');

  var COPY = {
    signin: { heading:'Sign in', sub:'Private client access and fitting schedule.', submit:'Sign In', foot:'New client? <a data-switch="signup">Register</a>' },
    signup: { heading:'Register', sub:'Create a client profile in under a minute.', submit:'Register', foot:'Already a client? <a data-switch="signin">Sign in</a>' }
  };
  function bindSwitchLinks(){ document.querySelectorAll('[data-switch]').forEach(function(a){ a.addEventListener('click', function(e){ e.preventDefault(); setMode(a.getAttribute('data-switch')); }); }); }
  function setMode(mode){
    tabs.forEach(function(t){ t.classList.toggle('active', t.dataset.tab===mode); });
    var showExtra = mode==='signup';
    nameField.style.maxHeight = showExtra ? nameField.scrollHeight+'px' : '0px';
    nameField.style.opacity = showExtra?1:0;
    signinOnlyRow.style.display = mode==='signin' ? 'flex' : 'none';
    heading.textContent = COPY[mode].heading;
    subhead.textContent = COPY[mode].sub;
    submitLabel.textContent = COPY[mode].submit;
    footNote.innerHTML = COPY[mode].foot;
    bindSwitchLinks();
  }
  tabs.forEach(function(t){ t.addEventListener('click', function(){ setMode(t.dataset.tab); }); });
  bindSwitchLinks();
  window.addEventListener('message', function(e){ if(e.data && e.data.type==='loginkit-accent'){ document.documentElement.style.setProperty('--chalk', e.data.color); } });
})();
</script>

</body>
</html>
