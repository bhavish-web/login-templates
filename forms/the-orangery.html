<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Orangery — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sage:#1c2b22; --card:#22332a; --brass:#b99a55; --brass-bright:#d4b76e; --line:rgba(185,154,85,0.16); --cream:#eef1ea; --dim:#8ea08f;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--sage); color:var(--cream); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;
    min-height:100vh; display:grid; grid-template-columns:1fr 1fr;
  }
  @media(max-width:860px){ body{ grid-template-columns:1fr; } .glass-side{ display:none; } }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  :focus-visible{ outline:1px solid var(--brass-bright); outline-offset:2px; }

  .glass-side{
    position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center;
    background:
      repeating-linear-gradient(0deg, rgba(185,154,85,0.05) 0 1px, transparent 1px 48px),
      repeating-linear-gradient(90deg, rgba(185,154,85,0.05) 0 1px, transparent 1px 48px),
      linear-gradient(170deg, #24362a, #1c2b22);
  }
  .vine{ width:60%; max-width:220px; }
  .vine path{ fill:none; stroke:var(--brass); stroke-width:1.5; stroke-linecap:round; stroke-dasharray:400; stroke-dashoffset:400; animation:grow 2s cubic-bezier(.4,0,.2,1) forwards; animation-delay:.2s; }
  @keyframes grow{ to{ stroke-dashoffset:0; } }
  .leaf{ opacity:0; animation:leafIn .5s ease forwards; }
  .leaf:nth-child(1){ animation-delay:.5s; } .leaf:nth-child(2){ animation-delay:.9s; }
  .leaf:nth-child(3){ animation-delay:1.3s; } .leaf:nth-child(4){ animation-delay:1.7s; }
  @keyframes leafIn{ to{ opacity:1; } }

  .form-side{ display:flex; align-items:center; justify-content:center; padding:48px; }
  .panel{ width:100%; max-width:360px;
    opacity:0; transform:translateY(14px); animation:reveal .9s cubic-bezier(.16,1,.3,1) forwards; animation-delay:.15s; }
  @keyframes reveal{ to{ opacity:1; transform:none; } }

  .brand{ font-size:11px; letter-spacing:.22em; color:var(--brass); margin-bottom:16px; }
  h1{ font-family:'Cormorant Garamond', serif; font-weight:500; font-style:italic; font-size:29px; margin-bottom:8px; }
  .sub{ font-size:13.5px; color:var(--dim); margin-bottom:30px; }

  .tabs{ display:flex; gap:26px; margin-bottom:30px; }
  .tabs button{ background:none; border:none; color:var(--dim); font-size:12.5px; font-weight:600; padding:0; cursor:pointer; transition:color .3s ease; }
  .tabs button.active{ color:var(--brass-bright); }

  .field{ margin-bottom:22px; }
  .field label{ display:block; font-size:11px; letter-spacing:.04em; color:var(--dim); margin-bottom:8px; }
  .field input{ width:100%; background:rgba(255,255,255,0.03); border:1px solid var(--line); color:var(--cream); font-size:15px; padding:10px 32px 10px 12px; border-radius:2px; outline:none; transition:border-color .2s ease; }
  .field input:focus{ border-color:var(--brass); }
  .field input::placeholder{ color:var(--dim); opacity:.5; }
  .extra{ max-height:0; opacity:0; overflow:hidden; transition:max-height .5s cubic-bezier(.4,0,.2,1), opacity .35s ease; }
  .field-wrap{ position:relative; }
  .eye-btn{ position:absolute; right:2px; bottom:6px; background:none; border:none; padding:5px; cursor:pointer; color:var(--dim); display:flex; }
  .eye-btn:hover{ color:var(--brass-bright); }
  .eye-btn svg{ width:15px; height:15px; }

  .row-between{ display:flex; justify-content:space-between; font-size:12px; color:var(--dim); margin:0 0 28px; }
  .row-between a{ color:var(--dim); text-decoration:none; border-bottom:1px solid var(--line); }
  .row-between a:hover{ color:var(--brass-bright); }
  .checkbox{ display:flex; align-items:center; gap:7px; }
  .checkbox input{ accent-color:var(--brass); width:13px; height:13px; }

  button.enter{ position:relative; width:100%; background:transparent; border:1px solid var(--brass); color:var(--brass-bright); font-size:13.5px; font-weight:600;
    padding:13px; cursor:pointer; overflow:hidden; isolation:isolate; transition:color .45s ease; }
  button.enter::before{ content:""; position:absolute; left:0; right:0; bottom:0; height:0%; background:linear-gradient(180deg, var(--brass-bright), var(--brass)); transition:height .45s cubic-bezier(.65,0,.35,1); z-index:-1; }
  button.enter:hover{ color:#1c2b22; }
  button.enter:hover::before{ height:100%; }

  .foot{ text-align:center; font-size:12.5px; color:var(--dim); margin-top:22px; }
  .foot a{ color:var(--brass-bright); text-decoration:none; cursor:pointer; }
  .foot a:hover{ text-decoration:underline; }
</style>
</head>
<body>

<div class="glass-side">
  <svg class="vine" viewBox="0 0 100 240">
    <path d="M50 235 C 50 190, 30 170, 45 130 C 60 90, 40 70, 50 20"/>
    <circle class="leaf" cx="38" cy="170" r="7"/>
    <circle class="leaf" cx="58" cy="120" r="8"/>
    <circle class="leaf" cx="36" cy="80" r="6"/>
    <circle class="leaf" cx="56" cy="40" r="7"/>
  </svg>
</div>

<div class="form-side">
  <div class="panel">
    <div class="brand">THE ORANGERY</div>
    <h1 id="heading">Welcome back</h1>
    <p class="sub" id="subhead">Your plant care schedule and greenhouse notes.</p>

    <div class="tabs" id="tabs">
      <button class="active" data-tab="signin" type="button">Sign in</button>
      <button data-tab="signup" type="button">Create account</button>
    </div>

    <form onsubmit="return false;">
      <div class="field extra" id="nameField"><div class="field-wrap">
        <label for="nameInput">Full name</label>
        <input type="text" id="nameInput" placeholder="Jordan Rivera" autocomplete="name" />
      </div></div>
      <div class="field"><div class="field-wrap">
        <label for="emailInput">Email address</label>
        <input type="email" id="emailInput" placeholder="you@company.com" required autocomplete="email" />
      </div></div>
      <div class="field"><div class="field-wrap">
        <label for="pwInput">Password</label>
        <input type="password" id="pwInput" placeholder="••••••••••••" required autocomplete="current-password" class="has-eye" />
        <button type="button" class="eye-btn" data-for="pwInput" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div></div>
      <div class="row-between" id="signinOnlyRow">
        <label class="checkbox"><input type="checkbox" /> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>
      <button class="enter" type="submit"><span id="submitLabel">Sign in</span></button>
    </form>

    <p class="foot" id="footNote">New here? <a data-switch="signup">Create an account</a></p>
  </div>
</div>

<script>
(function(){
  document.querySelectorAll('.eye-btn').forEach(function(btn){
    var input = document.getElementById(btn.dataset.for);
    var showing = false;
    btn.addEventListener('click', function(){
      showing = !showing;
      input.type = showing ? 'text' : 'password';
      btn.setAttribute('aria-pressed', showing ? 'true' : 'false');
      btn.setAttribute('aria-label', showing ? 'Hide password' : 'Show password');
    });
  });

  var tabs = document.querySelectorAll('#tabs button[data-tab]');
  var nameField = document.getElementById('nameField');
  var signinOnlyRow = document.getElementById('signinOnlyRow');
  var heading = document.getElementById('heading');
  var subhead = document.getElementById('subhead');
  var submitLabel = document.getElementById('submitLabel');
  var footNote = document.getElementById('footNote');

  var COPY = {
    signin: { heading:'Welcome back', sub:'Your plant care schedule and greenhouse notes.', submit:'Sign in', foot:'New here? <a data-switch="signup">Create an account</a>' },
    signup: { heading:'Create your account', sub:'Track watering, light, and repotting for every plant.', submit:'Create account', foot:'Already have an account? <a data-switch="signin">Sign in</a>' }
  };
  function bindSwitchLinks(){ document.querySelectorAll('[data-switch]').forEach(function(a){ a.addEventListener('click', function(e){ e.preventDefault(); setMode(a.getAttribute('data-switch')); }); }); }
  function setMode(mode){
    tabs.forEach(function(t){ t.classList.toggle('active', t.dataset.tab===mode); });
    var showExtra = mode==='signup';
    nameField.style.maxHeight = showExtra ? nameField.scrollHeight+'px' : '0px';
    nameField.style.opacity = showExtra?1:0;
    signinOnlyRow.style.display = mode==='signin' ? 'flex' : 'none';
    heading.textContent = COPY[mode].heading;
    subhead.textContent = COPY[mode].sub;
    submitLabel.textContent = COPY[mode].submit;
    footNote.innerHTML = COPY[mode].foot;
    bindSwitchLinks();
  }
  tabs.forEach(function(t){ t.addEventListener('click', function(){ setMode(t.dataset.tab); }); });
  bindSwitchLinks();
  window.addEventListener('message', function(e){ if(e.data && e.data.type==='loginkit-accent'){ document.documentElement.style.setProperty('--brass', e.data.color); } });
})();
</script>

</body>
</html>
