<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Cartographer's Society — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment:#ede0c0; --card:#f7f0da; --teal:#1f4d47; --teal-bright:#2c6a61; --line:#d8c898; --ink:#2b2415; --dim:#8a7d55;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--parchment); color:var(--ink); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:60px 24px; position:relative; overflow:hidden;
  }
  body::before{
    content:""; position:fixed; inset:0; opacity:.5; pointer-events:none;
    background-image:radial-gradient(circle at 20% 30%, transparent 0, transparent 60px, rgba(31,77,71,0.04) 61px, transparent 63px),
      radial-gradient(circle at 80% 70%, transparent 0, transparent 90px, rgba(31,77,71,0.04) 91px, transparent 93px);
  }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  :focus-visible{ outline:1px solid var(--teal); outline-offset:2px; }

  .stage{ position:relative; z-index:1; width:100%; max-width:380px; text-align:center; }

  .compass-wrap{ display:flex; justify-content:center; margin-bottom:20px; }
  .compass{ width:58px; height:58px; }
  .compass circle{ fill:none; stroke:var(--teal); stroke-width:1; opacity:.5; }
  .compass .tick{ stroke:var(--teal); stroke-width:1; opacity:.4; }
  .needle{ transform-origin:29px 29px; animation:settle 1.3s cubic-bezier(.34,1.56,.64,1) forwards; }
  @keyframes settle{ 0%{ transform:rotate(-140deg); } 60%{ transform:rotate(20deg); } 100%{ transform:rotate(0deg); } }
  .needle path{ fill:var(--teal); }

  .brand{ font-size:11px; letter-spacing:.2em; color:var(--teal); margin-bottom:14px;
    opacity:0; animation:fadeIn .7s ease forwards; animation-delay:.9s; }
  h1{ font-family:'Playfair Display', serif; font-weight:600; font-size:27px; margin-bottom:8px;
    opacity:0; animation:fadeUp .7s cubic-bezier(.16,1,.3,1) forwards; animation-delay:1s; }
  .sub{ font-size:13.5px; color:var(--dim); margin-bottom:30px;
    opacity:0; animation:fadeUp .7s cubic-bezier(.16,1,.3,1) forwards; animation-delay:1.06s; }
  @keyframes fadeIn{ to{ opacity:1; } }
  @keyframes fadeUp{ to{ opacity:1; transform:none; } }
  h1, .sub{ transform:translateY(8px); }

  .panel{ text-align:left; background:var(--card); border:1px solid var(--line); padding:36px 32px; border-radius:2px;
    opacity:0; animation:fadeUp .8s cubic-bezier(.16,1,.3,1) forwards; animation-delay:1.12s; }

  .tabs{ position:relative; display:flex; gap:4px; margin-bottom:28px; background:rgba(31,77,71,0.06); border-radius:999px; padding:4px; }
  .tabs button{ position:relative; z-index:2; flex:1; background:none; border:none; color:var(--dim); font-size:12px; font-weight:600; padding:9px 0; cursor:pointer; transition:color .3s ease; border-radius:999px; }
  .tabs button.active{ color:#f7f0da; }
  .tab-indicator{ position:absolute; top:4px; bottom:4px; z-index:1; border-radius:999px; background:var(--teal); transition:transform .45s cubic-bezier(.65,0,.35,1), width .45s cubic-bezier(.65,0,.35,1); }

  .field{ position:relative; margin-bottom:22px; }
  .field label{ display:block; font-size:11px; letter-spacing:.04em; color:var(--dim); margin-bottom:7px; }
  .field input{ width:100%; background:var(--parchment); border:1.5px solid var(--line); color:var(--ink); font-size:15px; padding:10px 12px; outline:none; transition:border-color .2s ease; }
  .field input:focus{ border-color:var(--teal); }
  .field input::placeholder{ color:var(--dim); opacity:.5; }
  .extra{ max-height:0; opacity:0; overflow:hidden; transition:max-height .5s cubic-bezier(.4,0,.2,1), opacity .35s ease; }

  .row-between{ display:flex; justify-content:space-between; font-size:12px; color:var(--dim); margin:0 0 26px; }
  .row-between a{ color:var(--dim); text-decoration:none; border-bottom:1px solid var(--line); }
  .row-between a:hover{ color:var(--teal); }
  .checkbox{ display:flex; align-items:center; gap:7px; }
  .checkbox input{ accent-color:var(--teal); width:13px; height:13px; }

  button.enter{ width:100%; background:var(--teal); border:none; color:#f7f0da; font-size:13.5px; font-weight:600; padding:14px; border-radius:2px; cursor:pointer; transition:background .25s ease, transform .1s ease; }
  button.enter:hover{ background:var(--teal-bright); }
  button.enter:active{ transform:scale(.99); }

  .divider{ display:flex; align-items:center; gap:14px; margin:24px 0; color:var(--dim); font-size:11px; }
  .divider::before,.divider::after{ content:""; flex:1; height:1px; background:var(--line); }
  button.ghost{ width:100%; background:none; border:1px solid var(--line); color:var(--ink); font-size:13px; padding:12px; cursor:pointer; transition:border-color .2s ease; }
  button.ghost:hover{ border-color:var(--teal); }
  .foot{ text-align:center; font-size:12.5px; color:var(--dim); margin-top:22px; }
  .foot a{ color:var(--teal); text-decoration:none; font-weight:600; }
  .foot a:hover{ text-decoration:underline; }
</style>
</head>
<body>

<div class="stage">
  <div class="compass-wrap">
    <svg class="compass" viewBox="0 0 58 58">
      <circle cx="29" cy="29" r="26"/><circle cx="29" cy="29" r="19"/>
      <g class="tick"><line x1="29" y1="4" x2="29" y2="10"/><line x1="29" y1="48" x2="29" y2="54"/><line x1="4" y1="29" x2="10" y2="29"/><line x1="48" y1="29" x2="54" y2="29"/></g>
      <g class="needle"><path d="M29 12 L33 29 L29 46 L25 29 Z"/></g>
    </svg>
  </div>

  <div class="brand">THE CARTOGRAPHER'S SOCIETY</div>
  <h1 id="heading">Sign in</h1>
  <p class="sub" id="subhead">Your expeditions, charts, and field notes.</p>

  <div class="panel">
    <div class="tabs" id="tabs">
      <button class="active" data-tab="signin" type="button">Sign In</button>
      <button data-tab="signup" type="button">Join</button>
      <span class="tab-indicator" id="tabIndicator"></span>
    </div>

    <form onsubmit="return false;">
      <div class="field extra" id="nameField">
        <label for="nameInput">Full name</label>
        <input type="text" id="nameInput" placeholder="Jordan Rivera" autocomplete="name" />
      </div>
      <div class="field">
        <label for="emailInput">Email address</label>
        <input type="email" id="emailInput" placeholder="you@company.com" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="pwInput">Password</label>
        <input type="password" id="pwInput" placeholder="••••••••••••" required autocomplete="current-password" class="has-eye" style="padding-right:34px;" />
        <button type="button" class="eye-btn" data-for="pwInput" aria-label="Show password" aria-pressed="false" style="position:absolute; right:2px; bottom:6px; background:none; border:none; padding:5px; cursor:pointer; color:var(--dim);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="15" height="15"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <div class="row-between" id="signinOnlyRow">
        <label class="checkbox"><input type="checkbox" /> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>
      <button class="enter" type="submit"><span id="submitLabel">Sign In</span></button>
    </form>

    <div class="divider">or continue with</div>
    <button class="ghost" type="button">Google</button>

    <p class="foot" id="footNote">New here? <a data-switch="signup">Join the Society</a></p>
  </div>
</div>

<script>
(function(){
  document.querySelectorAll('.eye-btn').forEach(function(btn){
    var input = document.getElementById(btn.dataset.for);
    var showing = false;
    btn.addEventListener('click', function(){
      showing = !showing;
      input.type = showing ? 'text' : 'password';
      btn.setAttribute('aria-pressed', showing ? 'true' : 'false');
      btn.setAttribute('aria-label', showing ? 'Hide password' : 'Show password');
    });
  });

  var tabs = document.querySelectorAll('#tabs button[data-tab]');
  var indicator = document.getElementById('tabIndicator');
  var nameField = document.getElementById('nameField');
  var signinOnlyRow = document.getElementById('signinOnlyRow');
  var heading = document.getElementById('heading');
  var subhead = document.getElementById('subhead');
  var submitLabel = document.getElementById('submitLabel');
  var footNote = document.getElementById('footNote');

  var COPY = {
    signin: { heading:'Sign in', sub:'Your expeditions, charts, and field notes.', submit:'Sign In', foot:'New here? <a data-switch="signup">Join the Society</a>' },
    signup: { heading:'Join the Society', sub:'Membership includes the annual atlas.', submit:'Join', foot:'Already a member? <a data-switch="signin">Sign in</a>' }
  };
  function positionIndicator(el){ indicator.style.width = el.offsetWidth+'px'; indicator.style.transform = 'translateX('+el.offsetLeft+'px)'; }
  function bindSwitchLinks(){ document.querySelectorAll('[data-switch]').forEach(function(a){ a.addEventListener('click', function(e){ e.preventDefault(); setMode(a.getAttribute('data-switch')); }); }); }
  function setMode(mode){
    tabs.forEach(function(t){ t.classList.toggle('active', t.dataset.tab===mode); if(t.dataset.tab===mode) positionIndicator(t); });
    var showExtra = mode==='signup';
    nameField.style.maxHeight = showExtra ? nameField.scrollHeight+'px' : '0px';
    nameField.style.opacity = showExtra?1:0;
    signinOnlyRow.style.display = mode==='signin' ? 'flex' : 'none';
    heading.textContent = COPY[mode].heading;
    subhead.textContent = COPY[mode].sub;
    submitLabel.textContent = COPY[mode].submit;
    footNote.innerHTML = COPY[mode].foot;
    bindSwitchLinks();
  }
  tabs.forEach(function(t){ t.addEventListener('click', function(){ setMode(t.dataset.tab); }); });
  bindSwitchLinks();
  window.addEventListener('load', function(){ positionIndicator(document.querySelector('#tabs button.active')); });
  window.addEventListener('message', function(e){ if(e.data && e.data.type==='loginkit-accent'){ document.documentElement.style.setProperty('--teal', e.data.color); } });
})();
</script>

</body>
</html>
