<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Glass Gradient / Cloud Indigo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#ffffff; --surface:#f7f8fb; --surface2:#eef0f7; --border:#e2e5ee;
  --text:#20242c; --text-dim:#7a8091; --accent:#4f5fea; --accent-dim:#c3c8f7;
  --accent-ink:#ffffff; --radius:12px;
  --font-display:'Sora', sans-serif; --font-body:'Inter', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
body{
  background:var(--bg); color:var(--text); font-family:var(--font-body);
  -webkit-font-smoothing:antialiased; animation:pageIn .5s ease both;
}
@keyframes pageIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
a{color:inherit;}
.field{margin-bottom:18px;}
.field label{
  display:flex;justify-content:space-between;align-items:baseline;
  font-family:var(--font-display); font-size:11.5px; letter-spacing:.06em;
  color:var(--text-dim); margin-bottom:8px; text-transform:uppercase;
}
.field label .req{color:var(--accent);}
.field input{
  width:100%; background:var(--surface2); border:1.5px solid var(--border);
  color:var(--text); font-family:var(--font-body); font-size:14.5px;
  padding:12px 14px; border-radius:var(--radius); outline:none;
  transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
}
.field input::placeholder{color:var(--text-dim); opacity:.6;}
.field input:focus{border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);}
.row-between{
  display:flex;justify-content:space-between;align-items:center;
  font-size:12.5px;color:var(--text-dim); margin:-4px 0 24px;
}
.row-between a{border-bottom:1px dotted var(--text-dim); text-decoration:none;}
.row-between a:hover{color:var(--accent); border-color:var(--accent);}
.checkbox{display:flex;align-items:center;gap:8px;}
.checkbox input{accent-color:var(--accent); width:14px;height:14px;}
button.submit{
  width:100%; background:var(--accent); color:var(--accent-ink); border:1.5px solid var(--accent);
  font-family:var(--font-display); font-weight:600; font-size:13.5px; letter-spacing:.03em;
  padding:13px; border-radius:var(--radius); cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:8px;
  transition:filter .15s ease, transform .1s ease;
  text-transform:uppercase;
}
button.submit:hover{filter:brightness(1.08);}
button.submit:active{transform:scale(.99);}
button.submit svg{width:14px;height:14px;flex:none;}
button.ghost{
  width:100%; background:transparent; color:var(--text); border:1.5px solid var(--border);
  font-family:var(--font-body); font-weight:500; font-size:13.5px;
  padding:12px; border-radius:var(--radius); cursor:pointer; margin-top:10px;
}
button.ghost:hover{border-color:var(--accent); color:var(--accent);}
.divider{
  display:flex;align-items:center;gap:14px;margin:24px 0;
  color:var(--text-dim); font-family:var(--font-display); font-size:10.5px; letter-spacing:.1em;
}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border);}
.footer-note{text-align:center;font-size:12.5px;color:var(--text-dim);}
.footer-note a{color:var(--accent);text-decoration:none;font-weight:600; cursor:pointer;}
.footer-note a:hover{text-decoration:underline;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

/* sign-in / sign-up toggle kit */
.auth-tabs{display:flex; gap:6px; padding:4px; background:var(--surface2); border:1px solid var(--border); border-radius:999px; margin-bottom:24px;}
.auth-tabs button{flex:1; border:none; background:transparent; padding:9px; border-radius:999px; font-family:var(--font-display); font-size:11.5px; font-weight:600; letter-spacing:.03em; text-transform:uppercase; cursor:pointer; color:var(--text-dim); transition:background .2s ease, color .2s ease;}
.auth-tabs button.active{background:var(--accent); color:var(--accent-ink);}
[data-extra]{max-height:0; opacity:0; overflow:hidden; transition:max-height .35s cubic-bezier(.4,0,.2,1), opacity .25s ease;}


    body{
      min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px;
      background:
        radial-gradient(circle at 15% 20%, rgba(124,231,196,0.25), transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(124,120,231,0.28), transparent 45%),
        var(--bg);
    }
    .card{
      width:100%; max-width:400px; padding:42px 36px; border-radius:var(--radius);
      background:var(--surface); border:1px solid var(--border);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      box-shadow:0 20px 60px rgba(0,0,0,0.35);
    }
    h1{font-family:var(--font-display); font-size:23px; margin-bottom:6px;}
    .sub{font-size:13.5px; color:var(--text-dim); margin-bottom:30px;}
    
</style>
</head>
<body>

    <div class="card">
      <h1 data-heading>Sign in</h1><div class="sub" data-sub>Your session floats free — glass, not walls.</div>
      
    <div class="auth-tabs">
      <button data-tab="signin" class="active" type="button">Sign In</button>
      <button data-tab="signup" type="button">Sign Up</button>
    </div>
    <form onsubmit="return false;">
      <div class="field" data-extra><label>FULL NAME</label><input type="text" placeholder="Jordan Rivera" /></div>
      <div class="field"><label>EMAIL <span class="req">*</span></label><input type="email" placeholder="you@company.com" required /></div>
      <div class="field"><label>PASSWORD <span class="req">*</span></label><input type="password" placeholder="••••••••••••" required /></div>
      <div class="field" data-extra><label>CONFIRM PASSWORD</label><input type="password" placeholder="••••••••••••" /></div>
      <div class="row-between" data-signin-only>
        <label class="checkbox"><input type="checkbox" /> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>
      <button class="submit" type="submit"><span data-submit-text>Sign In</span> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      <div class="divider">OR CONTINUE WITH</div>
      <button class="ghost" type="button">Continue with Google</button>
    </form>
    <p class="footer-note" data-foot-note style="margin-top:20px;">New here? <a data-switch="signup">Create an account</a></p>
    
    </div>
    
<script>
(function(){
  var tabs=document.querySelectorAll('[data-tab]');
  var extra=document.querySelectorAll('[data-extra]');
  var signinOnly=document.querySelectorAll('[data-signin-only]');
  var submitText=document.querySelector('[data-submit-text]');
  var heading=document.querySelector('[data-heading]');
  var sub=document.querySelector('[data-sub]');
  var footNote=document.querySelector('[data-foot-note]');
  var COPY={
    signin:{submit:'Sign In', heading:'Welcome back', sub:'Sign in to continue.', foot:'New here? <a data-switch="signup">Create an account</a>'},
    signup:{submit:'Create account', heading:'Create your account', sub:'Start in under a minute.', foot:'Already have an account? <a data-switch="signin">Sign in</a>'}
  };
  function bindSwitches(){
    document.querySelectorAll('[data-switch]').forEach(function(a){
      a.addEventListener('click', function(e){ e.preventDefault(); apply(a.getAttribute('data-switch')); });
    });
  }
  function apply(mode){
    tabs.forEach(function(t){ t.classList.toggle('active', t.dataset.tab===mode); });
    extra.forEach(function(el){
      if(mode==='signup'){ el.style.maxHeight=el.scrollHeight+'px'; el.style.opacity=1; }
      else { el.style.maxHeight='0px'; el.style.opacity=0; }
    });
    signinOnly.forEach(function(el){ el.style.display = mode==='signin' ? '' : 'none'; });
    if(submitText) submitText.textContent = COPY[mode].submit;
    if(heading) heading.textContent = COPY[mode].heading;
    if(sub) sub.textContent = COPY[mode].sub;
    if(footNote){ footNote.innerHTML = COPY[mode].foot; bindSwitches(); }
  }
  tabs.forEach(function(t){ t.addEventListener('click', function(){ apply(t.dataset.tab); }); });
  bindSwitches();
  window.addEventListener('message', function(e){
    if(e.data && e.data.type==='loginkit-accent'){
      document.documentElement.style.setProperty('--accent', e.data.color);
    }
  });
})();
</script>
</body>
</html>
