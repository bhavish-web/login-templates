<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Constantine &amp; Reeve — Client Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --burgundy:#1c0f12; --card:#241318; --brass:#b08d4f; --brass-bright:#d1af6f; --line:rgba(176,141,79,0.16); --cream:#efe6dd; --dim:#8f7d78;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--burgundy); color:var(--cream); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:60px 24px; position:relative; overflow:hidden;
  }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  :focus-visible{ outline:1px solid var(--brass-bright); outline-offset:2px; }

  .column{ position:fixed; top:0; bottom:0; width:1px; background:linear-gradient(180deg, transparent, var(--line) 15%, var(--line) 85%, transparent); }
  .column.c1{ left:12%; } .column.c2{ left:22%; } .column.c3{ right:22%; } .column.c4{ right:12%; }

  .stage{ position:relative; z-index:1; width:100%; max-width:380px; text-align:center;
    opacity:0; animation:fadeIn .3s ease forwards; }
  @keyframes fadeIn{ to{ opacity:1; } }

  .crest{ width:38px; height:38px; margin:0 auto 18px; border:1px solid var(--brass); border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:'Playfair Display', serif; font-size:16px; color:var(--brass-bright);
    opacity:0; transform:scale(.7); animation:crestIn .6s cubic-bezier(.34,1.4,.4,1) forwards; animation-delay:.1s; }
  @keyframes crestIn{ to{ opacity:1; transform:scale(1); } }

  .brand{ font-size:11px; letter-spacing:.24em; color:var(--brass); margin-bottom:16px;
    opacity:0; animation:fadeUp .6s cubic-bezier(.16,1,.3,1) forwards; animation-delay:.3s; }
  h1{ font-family:'Playfair Display', serif; font-weight:600; font-size:25px; margin-bottom:8px;
    opacity:0; animation:fadeUp .6s cubic-bezier(.16,1,.3,1) forwards; animation-delay:.38s; }
  .sub{ font-size:13px; color:var(--dim); margin-bottom:32px;
    opacity:0; animation:fadeUp .6s cubic-bezier(.16,1,.3,1) forwards; animation-delay:.44s; }
  @keyframes fadeUp{ to{ opacity:1; transform:none; } }
  h1, .sub{ transform:translateY(6px); }

  .panel{ text-align:left; background:var(--card); border:1px solid var(--line); padding:36px 32px;
    opacity:0; animation:fadeUp .7s cubic-bezier(.16,1,.3,1) forwards; animation-delay:.5s; }

  .field{ position:relative; margin-bottom:24px; }
  .field label{ display:block; font-size:11px; letter-spacing:.04em; color:var(--dim); margin-bottom:8px; }
  .field input{ width:100%; background:none; border:none; border-bottom:1px solid var(--line); color:var(--cream); font-size:15px; padding:9px 32px 9px 0; outline:none; transition:border-color .3s ease; }
  .field input:focus{ border-color:var(--brass); }
  .field input::placeholder{ color:var(--dim); opacity:.5; }
  .eye-btn{ position:absolute; right:2px; bottom:6px; background:none; border:none; padding:5px; cursor:pointer; color:var(--dim); display:flex; }
  .eye-btn:hover{ color:var(--brass-bright); }
  .eye-btn svg{ width:15px; height:15px; }

  .row-between{ display:flex; justify-content:space-between; font-size:12px; color:var(--dim); margin:0 0 26px; }
  .row-between a{ color:var(--dim); text-decoration:none; border-bottom:1px solid var(--line); }
  .row-between a:hover{ color:var(--brass-bright); }
  .checkbox{ display:flex; align-items:center; gap:7px; }
  .checkbox input{ accent-color:var(--brass); width:13px; height:13px; }

  button.enter{ width:100%; background:var(--brass); border:none; color:#1c0f12; font-size:13.5px; font-weight:600; padding:13px; cursor:pointer; transition:background .25s ease, transform .1s ease; }
  button.enter:hover{ background:var(--brass-bright); }
  button.enter:active{ transform:scale(.99); }

  .foot{ text-align:center; font-size:12px; color:var(--dim); margin-top:24px; line-height:1.6; }
  .foot a{ color:var(--brass-bright); text-decoration:none; }
  .foot a:hover{ text-decoration:underline; }
</style>
</head>
<body>

<div class="column c1"></div><div class="column c2"></div><div class="column c3"></div><div class="column c4"></div>

<div class="stage">
  <div class="crest">CR</div>
  <div class="brand">CONSTANTINE &amp; REEVE</div>
  <h1>Client portal</h1>
  <p class="sub">Case documents, correspondence, and billing.</p>

  <div class="panel">
    <form onsubmit="return false;">
      <div class="field">
        <label for="emailInput">Email address</label>
        <input type="email" id="emailInput" placeholder="you@company.com" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="pwInput">Password</label>
        <input type="password" id="pwInput" placeholder="••••••••••••" required autocomplete="current-password" class="has-eye" />
        <button type="button" class="eye-btn" data-for="pwInput" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <div class="row-between">
        <label class="checkbox"><input type="checkbox" /> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>
      <button class="enter" type="submit">Sign in</button>
    </form>
  </div>

  <p class="foot">Access is provisioned by your case manager.<br/><a href="#">Request portal access</a></p>
</div>

<script>
(function(){
  document.querySelectorAll('.eye-btn').forEach(function(btn){
    var input = document.getElementById(btn.dataset.for);
    var showing = false;
    btn.addEventListener('click', function(){
      showing = !showing;
      input.type = showing ? 'text' : 'password';
      btn.setAttribute('aria-pressed', showing ? 'true' : 'false');
      btn.setAttribute('aria-label', showing ? 'Hide password' : 'Show password');
    });
  });
  window.addEventListener('message', function(e){ if(e.data && e.data.type==='loginkit-accent'){ document.documentElement.style.setProperty('--brass', e.data.color); } });
})();
</script>

</body>
</html>
