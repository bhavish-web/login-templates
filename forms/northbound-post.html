<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Northbound Post — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f6ede0; --card:#fffaf0; --crimson:#8a2432; --crimson-bright:#a8394a; --line:#e3cfae; --ink:#241a16; --dim:#8a7458;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--cream); color:var(--ink); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:60px 24px;
  }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  :focus-visible{ outline:1px solid var(--crimson); outline-offset:2px; }

  .stage{ width:100%; max-width:380px; }

  .seal-wrap{ display:flex; justify-content:center; margin-bottom:8px; position:relative; z-index:2; }
  .seal{ width:56px; height:56px; border-radius:50%; background:radial-gradient(circle at 35% 30%, var(--crimson-bright), var(--crimson) 70%);
    display:flex; align-items:center; justify-content:center; font-family:'Fraunces', serif; color:#f6ede0; font-size:20px; font-weight:600;
    box-shadow:0 8px 20px -6px rgba(138,36,50,0.5);
    transform:scale(2.6) translateY(-10px); opacity:0; animation:stamp .5s cubic-bezier(.3,1.6,.4,1) forwards; animation-delay:.15s;
  }
  @keyframes stamp{ 0%{ transform:scale(2.6) translateY(-30px); opacity:0; } 60%{ transform:scale(.92) translateY(2px); opacity:1; } 100%{ transform:scale(1) translateY(0); opacity:1; } }

  .card{
    position:relative; margin-top:-28px; background:var(--card); border:1px solid var(--line); border-radius:3px; padding:44px 36px 36px;
    box-shadow:0 30px 70px -34px rgba(138,36,50,0.22);
    opacity:0; transform:translateY(10px); animation:fadeUp .7s cubic-bezier(.16,1,.3,1) forwards; animation-delay:.5s;
  }
  @keyframes fadeUp{ to{ opacity:1; transform:none; } }

  .brand{ text-align:center; font-size:11px; letter-spacing:.2em; color:var(--crimson); margin-bottom:16px; }
  h1{ font-family:'Fraunces', serif; font-weight:600; font-size:24px; margin-bottom:6px; text-align:center; }
  .sub{ font-size:13px; color:var(--dim); margin-bottom:28px; text-align:center; }

  .tabs{ display:flex; gap:24px; justify-content:center; margin-bottom:26px; }
  .tabs button{ background:none; border:1.5px solid transparent; color:var(--dim); font-size:12px; font-weight:600; padding:6px 0 8px; cursor:pointer; transition:color .3s ease, border-color .3s ease; }
  .tabs button.active{ color:var(--crimson); border-bottom-color:var(--crimson); }

  .field{ margin-bottom:20px; }
  .field label{ display:block; font-size:11px; letter-spacing:.04em; color:var(--dim); margin-bottom:6px; }
  .field input{ width:100%; background:var(--cream); border:1.5px solid var(--line); color:var(--ink); font-size:15px; padding:10px 32px 10px 12px; border-radius:2px; outline:none; transition:border-color .2s ease; }
  .field input:focus{ border-color:var(--crimson); }
  .field input::placeholder{ color:var(--dim); opacity:.55; }
  .extra{ max-height:0; opacity:0; overflow:hidden; transition:max-height .5s cubic-bezier(.4,0,.2,1), opacity .35s ease; }
  .field-wrap{ position:relative; }
  .eye-btn{ position:absolute; right:2px; bottom:6px; background:none; border:none; padding:5px; cursor:pointer; color:var(--dim); display:flex; }
  .eye-btn:hover{ color:var(--crimson); }
  .eye-btn svg{ width:15px; height:15px; }

  .row-between{ display:flex; justify-content:space-between; font-size:12px; color:var(--dim); margin:0 0 24px; }
  .row-between a{ color:var(--dim); text-decoration:none; border-bottom:1px solid var(--line); }
  .row-between a:hover{ color:var(--crimson); }
  .checkbox{ display:flex; align-items:center; gap:7px; }
  .checkbox input{ accent-color:var(--crimson); width:13px; height:13px; }

  button.enter{ position:relative; width:100%; background:var(--crimson); border:none; color:var(--cream); font-size:13.5px; font-weight:600; padding:13px; border-radius:2px; cursor:pointer;
    box-shadow:4px 4px 0 rgba(36,26,22,0.85); transition:transform .15s ease, box-shadow .15s ease; }
  button.enter:hover{ transform:translate(-2px,-2px); box-shadow:6px 6px 0 rgba(36,26,22,0.85); }
  button.enter:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 rgba(36,26,22,0.85); }

  .foot{ text-align:center; font-size:12.5px; color:var(--dim); margin-top:22px; }
  .foot a{ color:var(--crimson); text-decoration:none; font-weight:600; }
  .foot a:hover{ text-decoration:underline; }
</style>
</head>
<body>

<div class="stage">
  <div class="seal-wrap"><div class="seal">N</div></div>

  <div class="card">
    <div class="brand">NORTHBOUND POST</div>
    <h1 id="heading">Track your parcels</h1>
    <p class="sub" id="subhead">Sign in to your shipping account.</p>

    <div class="tabs" id="tabs">
      <button class="active" data-tab="signin" type="button">Sign In</button>
      <button data-tab="signup" type="button">Create account</button>
    </div>

    <form onsubmit="return false;">
      <div class="field extra" id="nameField"><div class="field-wrap">
        <label for="nameInput">Full name</label>
        <input type="text" id="nameInput" placeholder="Jordan Rivera" autocomplete="name" />
      </div></div>
      <div class="field"><div class="field-wrap">
        <label for="emailInput">Email address</label>
        <input type="email" id="emailInput" placeholder="you@company.com" required autocomplete="email" />
      </div></div>
      <div class="field"><div class="field-wrap">
        <label for="pwInput">Password</label>
        <input type="password" id="pwInput" placeholder="••••••••••••" required autocomplete="current-password" class="has-eye" />
        <button type="button" class="eye-btn" data-for="pwInput" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div></div>
      <div class="row-between" id="signinOnlyRow">
        <label class="checkbox"><input type="checkbox" /> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>
      <button class="enter" type="submit"><span id="submitLabel">Sign In</span></button>
    </form>

    <p class="foot" id="footNote">New here? <a data-switch="signup">Create an account</a></p>
  </div>
</div>

<script>
(function(){
  document.querySelectorAll('.eye-btn').forEach(function(btn){
    var input = document.getElementById(btn.dataset.for);
    var showing = false;
    btn.addEventListener('click', function(){
      showing = !showing;
      input.type = showing ? 'text' : 'password';
      btn.setAttribute('aria-pressed', showing ? 'true' : 'false');
      btn.setAttribute('aria-label', showing ? 'Hide password' : 'Show password');
    });
  });

  var tabs = document.querySelectorAll('#tabs button[data-tab]');
  var nameField = document.getElementById('nameField');
  var signinOnlyRow = document.getElementById('signinOnlyRow');
  var heading = document.getElementById('heading');
  var subhead = document.getElementById('subhead');
  var submitLabel = document.getElementById('submitLabel');
  var footNote = document.getElementById('footNote');

  var COPY = {
    signin: { heading:'Track your parcels', sub:'Sign in to your shipping account.', submit:'Sign In', foot:'New here? <a data-switch="signup">Create an account</a>' },
    signup: { heading:'Create your account', sub:'Track shipments and manage delivery preferences.', submit:'Create account', foot:'Already have an account? <a data-switch="signin">Sign in</a>' }
  };
  function bindSwitchLinks(){ document.querySelectorAll('[data-switch]').forEach(function(a){ a.addEventListener('click', function(e){ e.preventDefault(); setMode(a.getAttribute('data-switch')); }); }); }
  function setMode(mode){
    tabs.forEach(function(t){ t.classList.toggle('active', t.dataset.tab===mode); });
    var showExtra = mode==='signup';
    nameField.style.maxHeight = showExtra ? nameField.scrollHeight+'px' : '0px';
    nameField.style.opacity = showExtra?1:0;
    signinOnlyRow.style.display = mode==='signin' ? 'flex' : 'none';
    heading.textContent = COPY[mode].heading;
    subhead.textContent = COPY[mode].sub;
    submitLabel.textContent = COPY[mode].submit;
    footNote.innerHTML = COPY[mode].foot;
    bindSwitchLinks();
  }
  tabs.forEach(function(t){ t.addEventListener('click', function(){ setMode(t.dataset.tab); }); });
  bindSwitchLinks();
  window.addEventListener('message', function(e){ if(e.data && e.data.type==='loginkit-accent'){ document.documentElement.style.setProperty('--crimson', e.data.color); } });
})();
</script>

</body>
</html>
