<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ember &amp; Ash — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cocoa:#1c120c; --card:#241810; --caramel:#b5793f; --caramel-bright:#d4995e; --line:rgba(181,121,63,0.16); --cream:#f1e6d8; --dim:#96806a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--cocoa); color:var(--cream); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:60px 24px;
  }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  :focus-visible{ outline:1px solid var(--caramel-bright); outline-offset:2px; }

  .stage{ width:100%; max-width:380px; text-align:center; }

  .pour-wrap{ position:relative; height:36px; margin-bottom:14px; overflow:hidden; }
  .pour{ position:absolute; left:50%; top:0; width:3px; height:0; background:linear-gradient(to bottom, var(--caramel-bright), var(--caramel)); transform:translateX(-50%); border-radius:0 0 3px 3px; animation:pour .7s cubic-bezier(.6,0,.4,1) forwards; animation-delay:.1s; }
  @keyframes pour{ to{ height:36px; } }
  .pool{ position:absolute; bottom:0; left:50%; width:0; height:6px; background:var(--caramel); border-radius:50%; transform:translateX(-50%); animation:pool .4s ease forwards; animation-delay:.75s; }
  @keyframes pool{ to{ width:60px; } }

  .brand{ font-size:11px; letter-spacing:.22em; color:var(--caramel); margin-bottom:16px;
    opacity:0; animation:fadeUp .6s cubic-bezier(.16,1,.3,1) forwards; animation-delay:.9s; }
  h1{ font-family:'Cormorant Garamond', serif; font-weight:500; font-style:italic; font-size:29px; margin-bottom:8px;
    opacity:0; animation:fadeUp .6s cubic-bezier(.16,1,.3,1) forwards; animation-delay:.96s; }
  .sub{ font-size:13.5px; color:var(--dim); margin-bottom:32px;
    opacity:0; animation:fadeUp .6s cubic-bezier(.16,1,.3,1) forwards; animation-delay:1.02s; }
  @keyframes fadeUp{ to{ opacity:1; transform:none; } }
  h1, .sub{ transform:translateY(6px); }

  .panel{ text-align:left; background:var(--card); border:1px solid var(--line); padding:36px 32px; border-radius:3px;
    opacity:0; animation:fadeUp .7s cubic-bezier(.16,1,.3,1) forwards; animation-delay:1.08s; }

  .tabs{ position:relative; display:flex; gap:4px; margin-bottom:28px; background:rgba(255,255,255,0.03); border-radius:999px; padding:4px; }
  .tabs button{ position:relative; z-index:2; flex:1; background:none; border:none; color:var(--dim); font-size:12px; font-weight:600; padding:9px 0; cursor:pointer; transition:color .3s ease; border-radius:999px; }
  .tabs button.active{ color:#1c120c; }
  .tab-indicator{ position:absolute; top:4px; bottom:4px; z-index:1; border-radius:999px; background:var(--caramel); transition:transform .45s cubic-bezier(.65,0,.35,1), width .45s cubic-bezier(.65,0,.35,1); }

  .field{ position:relative; margin-bottom:22px; }
  .field label{ display:block; font-size:11px; letter-spacing:.04em; color:var(--dim); margin-bottom:7px; }
  .field input{ width:100%; background:rgba(255,255,255,0.03); border:1px solid var(--line); color:var(--cream); font-size:15px; padding:10px 32px 10px 12px; border-radius:3px; outline:none; transition:border-color .2s ease; }
  .field input:focus{ border-color:var(--caramel); }
  .field input::placeholder{ color:var(--dim); opacity:.5; }
  .extra{ max-height:0; opacity:0; overflow:hidden; transition:max-height .5s cubic-bezier(.4,0,.2,1), opacity .35s ease; }
  .eye-btn{ position:absolute; right:2px; bottom:6px; background:none; border:none; padding:5px; cursor:pointer; color:var(--dim); display:flex; }
  .eye-btn:hover{ color:var(--caramel-bright); }
  .eye-btn svg{ width:15px; height:15px; }

  .row-between{ display:flex; justify-content:space-between; font-size:12px; color:var(--dim); margin:0 0 26px; }
  .row-between a{ color:var(--dim); text-decoration:none; border-bottom:1px solid var(--line); }
  .row-between a:hover{ color:var(--caramel-bright); }
  .checkbox{ display:flex; align-items:center; gap:7px; }
  .checkbox input{ accent-color:var(--caramel); width:13px; height:13px; }

  button.enter{ position:relative; width:100%; background:var(--caramel); border:none; color:#1c120c; font-weight:600; font-size:13.5px; padding:13px; border-radius:3px; cursor:pointer; overflow:hidden; transition:filter .3s ease, transform .1s ease; }
  button.enter:hover{ filter:brightness(1.1); }
  button.enter:active{ transform:scale(.99); }
  button.enter::after{ content:""; position:absolute; top:0; left:-60%; width:40%; height:100%; background:linear-gradient(120deg, transparent, rgba(255,255,255,.35), transparent); transform:skewX(-20deg); transition:left .6s ease; }
  button.enter:hover::after{ left:120%; }

  .foot{ text-align:center; font-size:12.5px; color:var(--dim); margin-top:22px; }
  .foot a{ color:var(--caramel-bright); text-decoration:none; cursor:pointer; }
  .foot a:hover{ text-decoration:underline; }
</style>
</head>
<body>

<div class="stage">
  <div class="pour-wrap"><div class="pour"></div><div class="pool"></div></div>

  <div class="brand">EMBER &amp; ASH</div>
  <h1 id="heading">Sign in</h1>
  <p class="sub" id="subhead">Your orders, gifting lists, and tasting club.</p>

  <div class="panel">
    <div class="tabs" id="tabs">
      <button class="active" data-tab="signin" type="button">Sign in</button>
      <button data-tab="signup" type="button">Create account</button>
      <span class="tab-indicator" id="tabIndicator"></span>
    </div>

    <form onsubmit="return false;">
      <div class="field extra" id="nameField">
        <label for="nameInput">Full name</label>
        <input type="text" id="nameInput" placeholder="Jordan Rivera" autocomplete="name" />
      </div>
      <div class="field">
        <label for="emailInput">Email address</label>
        <input type="email" id="emailInput" placeholder="you@company.com" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="pwInput">Password</label>
        <input type="password" id="pwInput" placeholder="••••••••••••" required autocomplete="current-password" class="has-eye" />
        <button type="button" class="eye-btn" data-for="pwInput" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <div class="row-between" id="signinOnlyRow">
        <label class="checkbox"><input type="checkbox" /> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>
      <button class="enter" type="submit"><span id="submitLabel">Sign in</span></button>
    </form>

    <p class="foot" id="footNote">New here? <a data-switch="signup">Create an account</a></p>
  </div>
</div>

<script>
(function(){
  document.querySelectorAll('.eye-btn').forEach(function(btn){
    var input = document.getElementById(btn.dataset.for);
    var showing = false;
    btn.addEventListener('click', function(){
      showing = !showing;
      input.type = showing ? 'text' : 'password';
      btn.setAttribute('aria-pressed', showing ? 'true' : 'false');
      btn.setAttribute('aria-label', showing ? 'Hide password' : 'Show password');
    });
  });

  var tabs = document.querySelectorAll('#tabs button[data-tab]');
  var indicator = document.getElementById('tabIndicator');
  var nameField = document.getElementById('nameField');
  var signinOnlyRow = document.getElementById('signinOnlyRow');
  var heading = document.getElementById('heading');
  var subhead = document.getElementById('subhead');
  var submitLabel = document.getElementById('submitLabel');
  var footNote = document.getElementById('footNote');

  var COPY = {
    signin: { heading:'Sign in', sub:'Your orders, gifting lists, and tasting club.', submit:'Sign in', foot:'New here? <a data-switch="signup">Create an account</a>' },
    signup: { heading:'Create your account', sub:'Join the tasting club for early access to new batches.', submit:'Create account', foot:'Already have an account? <a data-switch="signin">Sign in</a>' }
  };
  function positionIndicator(el){ indicator.style.width = el.offsetWidth+'px'; indicator.style.transform = 'translateX('+el.offsetLeft+'px)'; }
  function bindSwitchLinks(){ document.querySelectorAll('[data-switch]').forEach(function(a){ a.addEventListener('click', function(e){ e.preventDefault(); setMode(a.getAttribute('data-switch')); }); }); }
  function setMode(mode){
    tabs.forEach(function(t){ t.classList.toggle('active', t.dataset.tab===mode); if(t.dataset.tab===mode) positionIndicator(t); });
    var showExtra = mode==='signup';
    nameField.style.maxHeight = showExtra ? nameField.scrollHeight+'px' : '0px';
    nameField.style.opacity = showExtra?1:0;
    signinOnlyRow.style.display = mode==='signin' ? 'flex' : 'none';
    heading.textContent = COPY[mode].heading;
    subhead.textContent = COPY[mode].sub;
    submitLabel.textContent = COPY[mode].submit;
    footNote.innerHTML = COPY[mode].foot;
    bindSwitchLinks();
  }
  tabs.forEach(function(t){ t.addEventListener('click', function(){ setMode(t.dataset.tab); }); });
  bindSwitchLinks();
  window.addEventListener('load', function(){ positionIndicator(document.querySelector('#tabs button.active')); });
  window.addEventListener('message', function(e){ if(e.data && e.data.type==='loginkit-accent'){ document.documentElement.style.setProperty('--caramel', e.data.color); } });
})();
</script>

</body>
</html>
