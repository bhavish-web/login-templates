<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nightjar Records — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --indigo:#0e0d16; --card:#161420; --amber:#d1934a; --amber-bright:#eab077; --line:rgba(209,147,74,0.14); --cream:#efeaf0; --dim:#847d94;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--indigo); color:var(--cream); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;
    min-height:100vh; display:grid; grid-template-columns:1fr 1fr;
  }
  @media(max-width:860px){ body{ grid-template-columns:1fr; } .vinyl-side{ display:none; } }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.01ms !important; transition-duration:.01ms !important; } .record{ animation:none !important; } }
  :focus-visible{ outline:1px solid var(--amber-bright); outline-offset:2px; }

  .vinyl-side{ position:relative; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at 50% 40%, #1a1826, #0e0d16); overflow:hidden; }
  .record{ width:56%; max-width:260px; border-radius:50%; animation:spin 6s linear infinite; animation-play-state:paused; }
  .record.playing{ animation-play-state:running; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .record circle:first-child{ fill:#0a0910; }
  .record .groove{ fill:none; stroke:rgba(209,147,74,0.12); }
  .record .label{ fill:var(--amber); }
  .record .hole{ fill:var(--indigo); }
  .tonearm{ position:absolute; top:14%; right:18%; width:34%; transform-origin:90% 10%; transform:rotate(-26deg); transition:transform 1s cubic-bezier(.4,0,.2,1); }
  .tonearm.down{ transform:rotate(0deg); }
  .tonearm line{ stroke:var(--dim); stroke-width:2; stroke-linecap:round; }
  .tonearm circle{ fill:var(--amber); }

  .form-side{ display:flex; align-items:center; justify-content:center; padding:48px; }
  .panel{ width:100%; max-width:360px;
    opacity:0; transform:translateY(14px); animation:reveal .9s cubic-bezier(.16,1,.3,1) forwards; animation-delay:.15s; }
  @keyframes reveal{ to{ opacity:1; transform:none; } }

  .brand{ font-size:11px; letter-spacing:.22em; color:var(--amber); margin-bottom:16px; }
  h1{ font-family:'Fraunces', serif; font-style:italic; font-weight:600; font-size:28px; margin-bottom:8px; }
  .sub{ font-size:13.5px; color:var(--dim); margin-bottom:30px; }

  .tabs{ position:relative; display:flex; gap:4px; margin-bottom:28px; background:rgba(255,255,255,0.03); border-radius:999px; padding:4px; }
  .tabs button{ position:relative; z-index:2; flex:1; background:none; border:none; color:var(--dim); font-size:12px; font-weight:600; padding:9px 0; cursor:pointer; transition:color .3s ease; border-radius:999px; }
  .tabs button.active{ color:#0e0d16; }
  .tab-indicator{ position:absolute; top:4px; bottom:4px; z-index:1; border-radius:999px; background:var(--amber); transition:transform .45s cubic-bezier(.65,0,.35,1), width .45s cubic-bezier(.65,0,.35,1); }

  .field{ position:relative; margin-bottom:22px; }
  .field label{ display:block; font-size:11px; letter-spacing:.04em; color:var(--dim); margin-bottom:7px; }
  .field input{ width:100%; background:rgba(255,255,255,0.03); border:1px solid var(--line); color:var(--cream); font-size:15px; padding:10px 32px 10px 12px; border-radius:3px; outline:none; transition:border-color .2s ease; }
  .field input:focus{ border-color:var(--amber); }
  .field input::placeholder{ color:var(--dim); opacity:.5; }
  .extra{ max-height:0; opacity:0; overflow:hidden; transition:max-height .5s cubic-bezier(.4,0,.2,1), opacity .35s ease; }
  .eye-btn{ position:absolute; right:2px; bottom:6px; background:none; border:none; padding:5px; cursor:pointer; color:var(--dim); display:flex; }
  .eye-btn:hover{ color:var(--amber-bright); }
  .eye-btn svg{ width:15px; height:15px; }

  .row-between{ display:flex; justify-content:space-between; font-size:12px; color:var(--dim); margin:0 0 26px; }
  .row-between a{ color:var(--dim); text-decoration:none; border-bottom:1px solid var(--line); }
  .row-between a:hover{ color:var(--amber-bright); }
  .checkbox{ display:flex; align-items:center; gap:7px; }
  .checkbox input{ accent-color:var(--amber); width:13px; height:13px; }

  button.enter{ position:relative; width:100%; background:var(--amber); border:none; color:#171008; font-weight:600; font-size:13.5px; padding:13px; border-radius:3px; cursor:pointer; overflow:hidden; transition:filter .3s ease, transform .1s ease; }
  button.enter:hover{ filter:brightness(1.1); }
  button.enter:active{ transform:scale(.99); }
  button.enter::after{ content:""; position:absolute; top:0; left:-60%; width:40%; height:100%; background:linear-gradient(120deg, transparent, rgba(255,255,255,.35), transparent); transform:skewX(-20deg); transition:left .6s ease; }
  button.enter:hover::after{ left:120%; }

  .foot{ text-align:center; font-size:12.5px; color:var(--dim); margin-top:22px; }
  .foot a{ color:var(--amber-bright); text-decoration:none; cursor:pointer; }
  .foot a:hover{ text-decoration:underline; }
</style>
</head>
<body>

<div class="vinyl-side">
  <svg class="tonearm" id="tonearm" viewBox="0 0 100 100"><line x1="90" y1="10" x2="20" y2="55"/><circle cx="90" cy="10" r="5"/><circle cx="20" cy="55" r="3"/></svg>
  <svg class="record" id="record" viewBox="0 0 200 200">
    <circle cx="100" cy="100" r="98"/>
    <circle class="groove" cx="100" cy="100" r="88"/><circle class="groove" cx="100" cy="100" r="76"/>
    <circle class="groove" cx="100" cy="100" r="64"/><circle class="groove" cx="100" cy="100" r="52"/>
    <circle class="label" cx="100" cy="100" r="38"/>
    <circle class="hole" cx="100" cy="100" r="4"/>
  </svg>
</div>

<div class="form-side">
  <div class="panel">
    <div class="brand">NIGHTJAR RECORDS</div>
    <h1 id="heading">Sign in</h1>
    <p class="sub" id="subhead">Your releases, royalties, and studio bookings.</p>

    <div class="tabs" id="tabs">
      <button class="active" data-tab="signin" type="button">Sign in</button>
      <button data-tab="signup" type="button">Create account</button>
      <span class="tab-indicator" id="tabIndicator"></span>
    </div>

    <form onsubmit="return false;">
      <div class="field extra" id="nameField">
        <label for="nameInput">Full name</label>
        <input type="text" id="nameInput" placeholder="Jordan Rivera" autocomplete="name" />
      </div>
      <div class="field">
        <label for="emailInput">Email address</label>
        <input type="email" id="emailInput" placeholder="you@company.com" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="pwInput">Password</label>
        <input type="password" id="pwInput" placeholder="••••••••••••" required autocomplete="current-password" class="has-eye" />
        <button type="button" class="eye-btn" data-for="pwInput" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <div class="row-between" id="signinOnlyRow">
        <label class="checkbox"><input type="checkbox" /> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>
      <button class="enter" type="submit"><span id="submitLabel">Sign in</span></button>
    </form>

    <p class="foot" id="footNote">New here? <a data-switch="signup">Create an account</a></p>
  </div>
</div>

<script>
(function(){
  var record = document.getElementById('record');
  var tonearm = document.getElementById('tonearm');
  setTimeout(function(){ tonearm.classList.add('down'); }, 400);
  setTimeout(function(){ record.classList.add('playing'); }, 1200);

  document.querySelectorAll('.eye-btn').forEach(function(btn){
    var input = document.getElementById(btn.dataset.for);
    var showing = false;
    btn.addEventListener('click', function(){
      showing = !showing;
      input.type = showing ? 'text' : 'password';
      btn.setAttribute('aria-pressed', showing ? 'true' : 'false');
      btn.setAttribute('aria-label', showing ? 'Hide password' : 'Show password');
    });
  });

  var tabs = document.querySelectorAll('#tabs button[data-tab]');
  var indicator = document.getElementById('tabIndicator');
  var nameField = document.getElementById('nameField');
  var signinOnlyRow = document.getElementById('signinOnlyRow');
  var heading = document.getElementById('heading');
  var subhead = document.getElementById('subhead');
  var submitLabel = document.getElementById('submitLabel');
  var footNote = document.getElementById('footNote');

  var COPY = {
    signin: { heading:'Sign in', sub:'Your releases, royalties, and studio bookings.', submit:'Sign in', foot:'New here? <a data-switch="signup">Create an account</a>' },
    signup: { heading:'Create your account', sub:'Submit demos and track your release schedule.', submit:'Create account', foot:'Already have an account? <a data-switch="signin">Sign in</a>' }
  };
  function positionIndicator(el){ indicator.style.width = el.offsetWidth+'px'; indicator.style.transform = 'translateX('+el.offsetLeft+'px)'; }
  function bindSwitchLinks(){ document.querySelectorAll('[data-switch]').forEach(function(a){ a.addEventListener('click', function(e){ e.preventDefault(); setMode(a.getAttribute('data-switch')); }); }); }
  function setMode(mode){
    tabs.forEach(function(t){ t.classList.toggle('active', t.dataset.tab===mode); if(t.dataset.tab===mode) positionIndicator(t); });
    var showExtra = mode==='signup';
    nameField.style.maxHeight = showExtra ? nameField.scrollHeight+'px' : '0px';
    nameField.style.opacity = showExtra?1:0;
    signinOnlyRow.style.display = mode==='signin' ? 'flex' : 'none';
    heading.textContent = COPY[mode].heading;
    subhead.textContent = COPY[mode].sub;
    submitLabel.textContent = COPY[mode].submit;
    footNote.innerHTML = COPY[mode].foot;
    bindSwitchLinks();
  }
  tabs.forEach(function(t){ t.addEventListener('click', function(){ setMode(t.dataset.tab); }); });
  bindSwitchLinks();
  window.addEventListener('load', function(){ positionIndicator(document.querySelector('#tabs button.active')); });
  window.addEventListener('message', function(e){ if(e.data && e.data.type==='loginkit-accent'){ document.documentElement.style.setProperty('--amber', e.data.color); } });
})();
</script>

</body>
</html>
