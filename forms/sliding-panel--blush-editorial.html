<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sliding Panel / Blush Editorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#f7eeea; --surface:#fffdfc; --surface2:#f1e4de; --border:#e4d2c9;
  --text:#2b2320; --text-dim:#8a7a72; --accent:#c1512f; --accent-dim:#e3c3b6;
  --accent-ink:#fff8f5; --radius:2px;
  --font-display:'Fraunces', serif; --font-body:'Inter', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
body{
  background:var(--bg); color:var(--text); font-family:var(--font-body);
  -webkit-font-smoothing:antialiased; animation:pageIn .5s ease both;
}
@keyframes pageIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
a{color:inherit;}
.field{margin-bottom:18px;}
.field label{
  display:flex;justify-content:space-between;align-items:baseline;
  font-family:var(--font-display); font-size:11.5px; letter-spacing:.06em;
  color:var(--text-dim); margin-bottom:8px; text-transform:uppercase;
}
.field label .req{color:var(--accent);}
.field input{
  width:100%; background:var(--surface2); border:1.5px solid var(--border);
  color:var(--text); font-family:var(--font-body); font-size:14.5px;
  padding:12px 14px; border-radius:var(--radius); outline:none;
  transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
}
.field input::placeholder{color:var(--text-dim); opacity:.6;}
.field input:focus{border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);}
.row-between{
  display:flex;justify-content:space-between;align-items:center;
  font-size:12.5px;color:var(--text-dim); margin:-4px 0 24px;
}
.row-between a{border-bottom:1px dotted var(--text-dim); text-decoration:none;}
.row-between a:hover{color:var(--accent); border-color:var(--accent);}
.checkbox{display:flex;align-items:center;gap:8px;}
.checkbox input{accent-color:var(--accent); width:14px;height:14px;}
button.submit{
  width:100%; background:var(--accent); color:var(--accent-ink); border:1.5px solid var(--accent);
  font-family:var(--font-display); font-weight:600; font-size:13.5px; letter-spacing:.03em;
  padding:13px; border-radius:var(--radius); cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:8px;
  transition:filter .15s ease, transform .1s ease;
  text-transform:uppercase;
}
button.submit:hover{filter:brightness(1.08);}
button.submit:active{transform:scale(.99);}
button.submit svg{width:14px;height:14px;flex:none;}
button.ghost{
  width:100%; background:transparent; color:var(--text); border:1.5px solid var(--border);
  font-family:var(--font-body); font-weight:500; font-size:13.5px;
  padding:12px; border-radius:var(--radius); cursor:pointer; margin-top:10px;
}
button.ghost:hover{border-color:var(--accent); color:var(--accent);}
.divider{
  display:flex;align-items:center;gap:14px;margin:24px 0;
  color:var(--text-dim); font-family:var(--font-display); font-size:10.5px; letter-spacing:.1em;
}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border);}
.footer-note{text-align:center;font-size:12.5px;color:var(--text-dim);}
.footer-note a{color:var(--accent);text-decoration:none;font-weight:600; cursor:pointer;}
.footer-note a:hover{text-decoration:underline;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

/* sign-in / sign-up toggle kit */
.auth-tabs{display:flex; gap:6px; padding:4px; background:var(--surface2); border:1px solid var(--border); border-radius:999px; margin-bottom:24px;}
.auth-tabs button{flex:1; border:none; background:transparent; padding:9px; border-radius:999px; font-family:var(--font-display); font-size:11.5px; font-weight:600; letter-spacing:.03em; text-transform:uppercase; cursor:pointer; color:var(--text-dim); transition:background .2s ease, color .2s ease;}
.auth-tabs button.active{background:var(--accent); color:var(--accent-ink);}
[data-extra]{max-height:0; opacity:0; overflow:hidden; transition:max-height .35s cubic-bezier(.4,0,.2,1), opacity .25s ease;}


    body{display:flex;min-height:100vh;}
    .auth-shell{display:grid; grid-template-columns:0.85fr 1fr; width:100%; min-height:100vh;}
    .overlay-pane{background:var(--accent); color:var(--accent-ink); position:relative; overflow:hidden;}
    .overlay-slot{position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; padding:50px; transition:transform .5s cubic-bezier(.65,0,.35,1), opacity .4s ease;}
    .overlay-slot[data-oslot="signup"]{transform:translateX(30px); opacity:0; pointer-events:none;}
    .auth-shell[data-mode="signup"] .overlay-slot[data-oslot="signin"]{transform:translateX(-30px); opacity:0; pointer-events:none;}
    .auth-shell[data-mode="signup"] .overlay-slot[data-oslot="signup"]{transform:translateX(0); opacity:1; pointer-events:auto;}
    .overlay-slot h2{font-family:var(--font-display); font-size:26px; margin-bottom:12px;}
    .overlay-slot p{font-size:14px; opacity:.85; margin-bottom:24px; max-width:280px;}
    .overlay-slot button{border:1.5px solid var(--accent-ink); background:transparent; color:var(--accent-ink); padding:10px 22px; border-radius:999px; font-family:var(--font-display); font-size:12px; letter-spacing:.03em; text-transform:uppercase; cursor:pointer;}
    .overlay-slot button:hover{background:var(--accent-ink); color:var(--accent);}
    .form-pane{position:relative; display:flex; align-items:center; justify-content:center; padding:40px;}
    .form-slot{position:absolute; width:100%; max-width:360px; transition:transform .5s cubic-bezier(.65,0,.35,1), opacity .4s ease;}
    .form-slot[data-slot="signup"]{transform:translateX(30px); opacity:0; pointer-events:none;}
    .auth-shell[data-mode="signup"] .form-slot[data-slot="signin"]{transform:translateX(-30px); opacity:0; pointer-events:none;}
    .auth-shell[data-mode="signup"] .form-slot[data-slot="signup"]{transform:translateX(0); opacity:1; pointer-events:auto;}
    h1{font-family:var(--font-display); font-size:22px; margin-bottom:6px;}
    .sub{font-size:13.5px;color:var(--text-dim);margin-bottom:26px;}
    @media(max-width:820px){.auth-shell{grid-template-columns:1fr;} .overlay-pane{display:none;}}
    
</style>
</head>
<body>

    <div class="auth-shell" data-mode="signin" id="authShell">
      <div class="overlay-pane">
        <div class="overlay-slot" data-oslot="signin"><h2>New here?</h2><p>Create an account to save your work and pick up anywhere.</p><button data-authtoggle="signup" type="button">Create account</button></div>
        <div class="overlay-slot" data-oslot="signup"><h2>Already with us?</h2><p>Sign in to get back to your workspace.</p><button data-authtoggle="signin" type="button">Sign in</button></div>
      </div>
      <div class="form-pane">
        <div class="form-slot" data-slot="signin">
          <h1>Welcome back</h1><div class="sub">Sign in to continue.</div>
          <form onsubmit="return false;">
            <div class="field"><label>EMAIL <span class="req">*</span></label><input type="email" placeholder="you@company.com" required /></div>
            <div class="field"><label>PASSWORD <span class="req">*</span></label><input type="password" placeholder="••••••••••••" required /></div>
            <div class="row-between"><label class="checkbox"><input type="checkbox" /> Remember me</label><a href="#">Forgot password?</a></div>
            <button class="submit" type="submit">Sign In <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
          </form>
        </div>
        <div class="form-slot" data-slot="signup">
          <h1>Create account</h1><div class="sub">Start in under a minute.</div>
          <form onsubmit="return false;">
            <div class="field"><label>FULL NAME</label><input type="text" placeholder="Jordan Rivera" /></div>
            <div class="field"><label>EMAIL <span class="req">*</span></label><input type="email" placeholder="you@company.com" required /></div>
            <div class="field"><label>PASSWORD <span class="req">*</span></label><input type="password" placeholder="••••••••••••" required /></div>
            <button class="submit" type="submit">Create account <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
          </form>
        </div>
      </div>
    </div>
    <script>
    document.querySelectorAll('[data-authtoggle]').forEach(function(b){ b.addEventListener('click', function(){ document.getElementById('authShell').dataset.mode = b.dataset.authtoggle; }); });
    
window.addEventListener('message', function(e){
  if(e.data && e.data.type==='loginkit-accent'){
    document.documentElement.style.setProperty('--accent', e.data.color);
  }
});
</script>

</body>
</html>
