<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Halcyon Baths — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --water:#0e1f22; --card:#f4f0e6; --teal:#2f6e6a; --teal-bright:#3f8f89; --line:#dcd6c4; --ink:#1c2523; --dim:#7d8a86;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--water); color:var(--ink); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:60px 24px; position:relative; overflow:hidden;
  }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  :focus-visible{ outline:1px solid var(--teal); outline-offset:2px; }

  .ripple{ position:absolute; top:50%; left:50%; border:1px solid rgba(63,143,137,0.35); border-radius:50%; transform:translate(-50%,-50%); pointer-events:none; }
  .ripple.r1{ width:120px; height:120px; animation:ripple 2.4s ease-out infinite; }
  .ripple.r2{ width:120px; height:120px; animation:ripple 2.4s ease-out infinite; animation-delay:.8s; }
  .ripple.r3{ width:120px; height:120px; animation:ripple 2.4s ease-out infinite; animation-delay:1.6s; }
  @keyframes ripple{ 0%{ width:60px; height:60px; opacity:.7; } 100%{ width:640px; height:640px; opacity:0; } }

  .stage{ position:relative; z-index:1; width:100%; max-width:380px; text-align:center;
    opacity:0; transform:translateY(14px); animation:reveal .9s cubic-bezier(.16,1,.3,1) forwards; animation-delay:.2s; }
  @keyframes reveal{ to{ opacity:1; transform:none; } }

  .brand{ font-size:11px; letter-spacing:.24em; color:var(--teal-bright); margin-bottom:16px; }
  h1{ font-family:'Cormorant Garamond', serif; font-weight:500; font-style:italic; font-size:29px; margin-bottom:8px; color:#eef4f2; }
  .sub{ font-size:13.5px; color:#93a9a5; margin-bottom:34px; }

  .panel{ text-align:left; background:var(--card); border-radius:3px; padding:38px 34px; box-shadow:0 40px 90px -30px rgba(0,0,0,0.5); }

  .tabs{ position:relative; display:flex; gap:4px; margin-bottom:28px; background:rgba(47,110,106,0.07); border-radius:999px; padding:4px; }
  .tabs button{ position:relative; z-index:2; flex:1; background:none; border:none; color:var(--dim); font-size:12px; font-weight:600; padding:9px 0; cursor:pointer; transition:color .3s ease; border-radius:999px; }
  .tabs button.active{ color:#f4f0e6; }
  .tab-indicator{ position:absolute; top:4px; bottom:4px; z-index:1; border-radius:999px; background:var(--teal); transition:transform .45s cubic-bezier(.65,0,.35,1), width .45s cubic-bezier(.65,0,.35,1); }

  .field{ position:relative; margin-bottom:22px; }
  .field label{ display:block; font-size:11px; letter-spacing:.04em; color:var(--dim); margin-bottom:7px; }
  .field input{ width:100%; background:#fffdf8; border:1.5px solid var(--line); color:var(--ink); font-size:15px; padding:10px 32px 10px 12px; border-radius:2px; outline:none; transition:border-color .2s ease; }
  .field input:focus{ border-color:var(--teal); }
  .field input::placeholder{ color:var(--dim); opacity:.55; }
  .extra{ max-height:0; opacity:0; overflow:hidden; transition:max-height .5s cubic-bezier(.4,0,.2,1), opacity .35s ease; }
  .eye-btn{ position:absolute; right:2px; bottom:6px; background:none; border:none; padding:5px; cursor:pointer; color:var(--dim); display:flex; }
  .eye-btn:hover{ color:var(--teal); }
  .eye-btn svg{ width:15px; height:15px; }

  .row-between{ display:flex; justify-content:space-between; font-size:12px; color:var(--dim); margin:0 0 26px; }
  .row-between a{ color:var(--dim); text-decoration:none; border-bottom:1px solid var(--line); }
  .row-between a:hover{ color:var(--teal); }
  .checkbox{ display:flex; align-items:center; gap:7px; }
  .checkbox input{ accent-color:var(--teal); width:13px; height:13px; }

  button.enter{ width:100%; background:var(--teal); border:none; color:#f4f0e6; font-family:'Cormorant Garamond', serif; font-style:italic; font-weight:600; font-size:17px; padding:13px; border-radius:2px; cursor:pointer; transition:background .25s ease, transform .1s ease; }
  button.enter:hover{ background:var(--teal-bright); }
  button.enter:active{ transform:scale(.99); }

  .foot{ text-align:center; font-size:12.5px; color:var(--dim); margin-top:22px; }
  .foot a{ color:var(--teal); text-decoration:none; font-weight:600; }
  .foot a:hover{ text-decoration:underline; }
</style>
</head>
<body>

<div class="ripple r1"></div><div class="ripple r2"></div><div class="ripple r3"></div>

<div class="stage">
  <div class="brand">HALCYON BATHS</div>
  <h1 id="heading">Reserve your visit</h1>
  <p class="sub" id="subhead">Sign in to book treatments and manage your membership.</p>

  <div class="panel">
    <div class="tabs" id="tabs">
      <button class="active" data-tab="signin" type="button">Sign in</button>
      <button data-tab="signup" type="button">Join</button>
      <span class="tab-indicator" id="tabIndicator"></span>
    </div>

    <form onsubmit="return false;">
      <div class="field extra" id="nameField">
        <label for="nameInput">Full name</label>
        <input type="text" id="nameInput" placeholder="Jordan Rivera" autocomplete="name" />
      </div>
      <div class="field">
        <label for="emailInput">Email address</label>
        <input type="email" id="emailInput" placeholder="you@company.com" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="pwInput">Password</label>
        <input type="password" id="pwInput" placeholder="••••••••••••" required autocomplete="current-password" class="has-eye" />
        <button type="button" class="eye-btn" data-for="pwInput" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <div class="row-between" id="signinOnlyRow">
        <label class="checkbox"><input type="checkbox" /> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>
      <button class="enter" type="submit"><span id="submitLabel">Sign in</span></button>
    </form>

    <p class="foot" id="footNote">New here? <a data-switch="signup">Join Halcyon</a></p>
  </div>
</div>

<script>
(function(){
  document.querySelectorAll('.eye-btn').forEach(function(btn){
    var input = document.getElementById(btn.dataset.for);
    var showing = false;
    btn.addEventListener('click', function(){
      showing = !showing;
      input.type = showing ? 'text' : 'password';
      btn.setAttribute('aria-pressed', showing ? 'true' : 'false');
      btn.setAttribute('aria-label', showing ? 'Hide password' : 'Show password');
    });
  });

  var tabs = document.querySelectorAll('#tabs button[data-tab]');
  var indicator = document.getElementById('tabIndicator');
  var nameField = document.getElementById('nameField');
  var signinOnlyRow = document.getElementById('signinOnlyRow');
  var heading = document.getElementById('heading');
  var subhead = document.getElementById('subhead');
  var submitLabel = document.getElementById('submitLabel');
  var footNote = document.getElementById('footNote');

  var COPY = {
    signin: { heading:'Reserve your visit', sub:'Sign in to book treatments and manage your membership.', submit:'Sign in', foot:'New here? <a data-switch="signup">Join Halcyon</a>' },
    signup: { heading:'Join Halcyon', sub:'Membership includes priority booking and guest passes.', submit:'Join', foot:'Already a member? <a data-switch="signin">Sign in</a>' }
  };
  function positionIndicator(el){ indicator.style.width = el.offsetWidth+'px'; indicator.style.transform = 'translateX('+el.offsetLeft+'px)'; }
  function bindSwitchLinks(){ document.querySelectorAll('[data-switch]').forEach(function(a){ a.addEventListener('click', function(e){ e.preventDefault(); setMode(a.getAttribute('data-switch')); }); }); }
  function setMode(mode){
    tabs.forEach(function(t){ t.classList.toggle('active', t.dataset.tab===mode); if(t.dataset.tab===mode) positionIndicator(t); });
    var showExtra = mode==='signup';
    nameField.style.maxHeight = showExtra ? nameField.scrollHeight+'px' : '0px';
    nameField.style.opacity = showExtra?1:0;
    signinOnlyRow.style.display = mode==='signin' ? 'flex' : 'none';
    heading.textContent = COPY[mode].heading;
    subhead.textContent = COPY[mode].sub;
    submitLabel.textContent = COPY[mode].submit;
    footNote.innerHTML = COPY[mode].foot;
    bindSwitchLinks();
  }
  tabs.forEach(function(t){ t.addEventListener('click', function(){ setMode(t.dataset.tab); }); });
  bindSwitchLinks();
  window.addEventListener('load', function(){ positionIndicator(document.querySelector('#tabs button.active')); });
  window.addEventListener('message', function(e){ if(e.data && e.data.type==='loginkit-accent'){ document.documentElement.style.setProperty('--teal', e.data.color); } });
})();
</script>

</body>
</html>
