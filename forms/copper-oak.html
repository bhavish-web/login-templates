<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Copper &amp; Oak — Suite Access</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --stone:#efe7d8; --card:#fffdf9; --ink:#241a12; --dim:#7c6c56; --copper:#a85a2e; --copper-bright:#c97a4a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--stone); color:var(--ink); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:60px 24px;
  }

  .frame{ position:relative; width:100%; max-width:420px; padding:54px 44px 44px;
    opacity:0; animation:fadeIn .6s ease forwards; animation-delay:.5s; }
  @keyframes fadeIn{ to{ opacity:1; } }

  .frame-line{ position:absolute; background:var(--copper); }
  .fl-top{ top:0; left:0; height:1.5px; width:0; animation:growX .6s cubic-bezier(.65,0,.35,1) forwards; animation-delay:0s; }
  .fl-right{ top:0; right:0; width:1.5px; height:0; animation:growY .6s cubic-bezier(.65,0,.35,1) forwards; animation-delay:.6s; }
  .fl-bottom{ bottom:0; right:0; height:1.5px; width:0; animation:growXr .6s cubic-bezier(.65,0,.35,1) forwards; animation-delay:1.2s; }
  .fl-left{ bottom:0; left:0; width:1.5px; height:0; animation:growYr .6s cubic-bezier(.65,0,.35,1) forwards; animation-delay:1.8s; }
  @keyframes growX{ from{width:0;} to{width:100%;} }
  @keyframes growXr{ from{width:0;} to{width:100%;} }
  @keyframes growY{ from{height:0;} to{height:100%;} }
  @keyframes growYr{ from{height:0;} to{height:100%;} }

  .suite-no{ font-size:11px; letter-spacing:.14em; color:var(--copper); margin-bottom:16px;
    opacity:0; animation:fadeUp .7s cubic-bezier(.16,1,.3,1) forwards; animation-delay:.15s; }
  h1{ font-family:'Fraunces', serif; font-weight:600; font-size:28px; line-height:1.15; margin-bottom:8px;
    opacity:0; animation:fadeUp .7s cubic-bezier(.16,1,.3,1) forwards; animation-delay:.22s; }
  .sub{ font-size:13.5px; color:var(--dim); margin-bottom:32px;
    opacity:0; animation:fadeUp .7s cubic-bezier(.16,1,.3,1) forwards; animation-delay:.28s; }
  @keyframes fadeUp{ to{ opacity:1; transform:none; } }
  h1, .sub, .suite-no{ transform:translateY(8px); }

  .tabs{ position:relative; display:flex; gap:4px; margin-bottom:30px; background:transparent; border:2px solid var(--ink); padding:4px;
    opacity:0; animation:fadeUp .7s cubic-bezier(.16,1,.3,1) forwards; animation-delay:.34s; }
  .tabs button{ position:relative; z-index:2; flex:1; background:none; border:none; color:var(--dim); font-size:11.5px; font-weight:600; padding:9px 0; cursor:pointer; transition:color .3s ease; text-transform:uppercase; letter-spacing:.03em; }
  .tabs button.active{ color:var(--stone); }
  .tab-indicator{ position:absolute; top:4px; bottom:4px; z-index:1; background:var(--copper); transition:transform .4s cubic-bezier(.65,0,.35,1), width .4s cubic-bezier(.65,0,.35,1); }

  form{ opacity:0; animation:fadeUp .7s cubic-bezier(.16,1,.3,1) forwards; animation-delay:.4s; }

  .field{ position:relative; margin-bottom:20px; }
  .field label{ display:block; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); margin-bottom:7px; }
  .field input{ width:100%; background:var(--stone); border:2px solid rgba(36,26,18,0.22); color:var(--ink); font-size:15px; padding:11px 12px; outline:none; transition:border-color .2s ease; }
  .field input:focus{ border-color:var(--copper); }
  .field input::placeholder{ color:rgba(36,26,18,0.35); }
  .extra{ max-height:0; opacity:0; overflow:hidden; transition:max-height .5s cubic-bezier(.4,0,.2,1), opacity .35s ease; }

  .row-between{ display:flex; justify-content:space-between; font-size:12px; color:var(--dim); margin:0 0 24px; }
  .row-between a{ color:var(--dim); text-decoration:none; border-bottom:1px solid rgba(36,26,18,0.18); }
  .row-between a:hover{ color:var(--copper); }
  .checkbox{ display:flex; align-items:center; gap:7px; }
  .checkbox input{ accent-color:var(--copper); width:13px; height:13px; }

  button.enter{ position:relative; width:100%; background:var(--ink); border:2px solid var(--ink); color:var(--stone);
    font-size:13.5px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; padding:14px; cursor:pointer;
    box-shadow:4px 4px 0 var(--copper); transition:transform .15s ease, box-shadow .15s ease; }
  button.enter span{ position:relative; }
  button.enter:hover{ transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--copper); }
  button.enter:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--copper); }

  .divider{ display:flex; align-items:center; gap:14px; margin:24px 0; color:var(--dim); font-size:11px; }
  .divider::before,.divider::after{ content:""; flex:1; height:1px; background:rgba(36,26,18,0.12); }
  button.ghost{ width:100%; background:none; border:1px solid rgba(36,26,18,0.18); color:var(--ink); font-size:13px; padding:12px; cursor:pointer; transition:border-color .2s ease; }
  button.ghost:hover{ border-color:var(--copper); }

  .foot{ text-align:center; font-size:12.5px; color:var(--dim); margin-top:22px; }
  .foot a{ color:var(--copper); text-decoration:none; cursor:pointer; font-weight:600; }
  .foot a:hover{ text-decoration:underline; }
  :focus-visible{ outline:1px solid var(--copper); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }

  .field{ position:relative; }
  .eye-btn{
    position:absolute; right:2px; bottom:6px; background:none; border:none; padding:5px; cursor:pointer;
    color:var(--dim); display:flex; align-items:center; justify-content:center; transition:color .2s ease; z-index:2;
  }
  .eye-btn:hover{ color:var(--copper); }
  .eye-btn svg{ width:15px; height:15px; }
  input.has-eye{ padding-right:32px !important; }
</style>
</head>
<body>

<div class="frame">
  <div class="frame-line fl-top"></div>
  <div class="frame-line fl-right"></div>
  <div class="frame-line fl-bottom"></div>
  <div class="frame-line fl-left"></div>

  <div class="suite-no">SUITE No. 04 · MEMBER ENTRANCE</div>
  <h1 id="heading">Welcome back</h1>
  <p class="sub" id="subhead">Your workshop, your commissions, your ledger.</p>

  <div class="tabs" id="tabs">
    <button class="active" data-tab="signin" type="button">Sign in</button>
    <button data-tab="signup" type="button">Register</button>
    <span class="tab-indicator" id="tabIndicator"></span>
  </div>

  <form onsubmit="return false;">
    <div class="field extra" id="nameField">
      <label for="nameInput">Full name</label>
      <input type="text" placeholder="Jordan Rivera" id="nameInput"  autocomplete="name" />
    </div>
    <div class="field">
      <label for="emailInput">Email address</label>
      <input type="email" placeholder="you@company.com" id="emailInput" required  autocomplete="email" />
    </div>
    <div class="field">
      <label for="pwInput">Password</label>
      <input type="password" placeholder="••••••••••••" id="pwInput" required  autocomplete="current-password"  class="has-eye" /><button type="button" class="eye-btn" data-for="pwInput" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <div class="field extra" id="confirmField">
      <label for="confirmInput">Confirm password</label>
      <input type="password" placeholder="••••••••••••" id="confirmInput"  autocomplete="new-password" />
    </div>
    <div class="row-between" id="signinOnlyRow">
      <label class="checkbox"><input type="checkbox" /> Remember me</label>
      <a href="#">Forgot password?</a>
    </div>
    <button class="enter" type="submit"><span id="submitLabel">Sign in</span></button>
  </form>

  <div class="divider">or continue with</div>
  <button class="ghost" type="button">Google</button>

  <p class="foot" id="footNote">New to the workshop? <a data-switch="signup">Register</a></p>
</div>

<script>
(function(){
  document.querySelectorAll('.eye-btn').forEach(function(btn){
    var input = document.getElementById(btn.dataset.for);
    if(!input) return;
    var showing = false;
    btn.addEventListener('click', function(){
      showing = !showing;
      input.type = showing ? 'text' : 'password';
      btn.setAttribute('aria-pressed', showing ? 'true' : 'false');
      btn.setAttribute('aria-label', showing ? 'Hide password' : 'Show password');
      btn.innerHTML = showing ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17.94 17.94A10.94 10.94 0 0112 19c-7 0-11-7-11-7a20.6 20.6 0 015.06-5.94M9.9 4.24A10.4 10.4 0 0112 4c7 0 11 7 11 7a20.6 20.6 0 01-2.16 3.19M14.12 14.12a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>';
    });
  });

  var tabs = document.querySelectorAll('#tabs button[data-tab]');
  var indicator = document.getElementById('tabIndicator');
  var nameField = document.getElementById('nameField');
  var confirmField = document.getElementById('confirmField');
  var signinOnlyRow = document.getElementById('signinOnlyRow');
  var heading = document.getElementById('heading');
  var subhead = document.getElementById('subhead');
  var submitLabel = document.getElementById('submitLabel');
  var footNote = document.getElementById('footNote');

  var COPY = {
    signin: { heading:'Welcome back', sub:'Your workshop, your commissions, your ledger.', submit:'Sign in', foot:'New to the workshop? <a data-switch="signup">Register</a>' },
    signup: { heading:'Register your account', sub:'Set up your workshop profile in a minute.', submit:'Register', foot:'Already registered? <a data-switch="signin">Sign in</a>' }
  };

  function positionIndicator(el){ indicator.style.width = el.offsetWidth+'px'; indicator.style.transform = 'translateX('+el.offsetLeft+'px)'; }
  function bindSwitchLinks(){ document.querySelectorAll('[data-switch]').forEach(function(a){ a.addEventListener('click', function(e){ e.preventDefault(); setMode(a.getAttribute('data-switch')); }); }); }

  function setMode(mode){
    tabs.forEach(function(t){ t.classList.toggle('active', t.dataset.tab===mode); if(t.dataset.tab===mode) positionIndicator(t); });
    var showExtra = mode==='signup';
    [nameField, confirmField].forEach(function(f){ f.style.maxHeight = showExtra ? f.scrollHeight+'px' : '0px'; f.style.opacity = showExtra?1:0; });
    signinOnlyRow.style.display = mode==='signin' ? 'flex' : 'none';
    heading.textContent = COPY[mode].heading;
    subhead.textContent = COPY[mode].sub;
    submitLabel.textContent = COPY[mode].submit;
    footNote.innerHTML = COPY[mode].foot;
    bindSwitchLinks();
  }
  tabs.forEach(function(t){ t.addEventListener('click', function(){ setMode(t.dataset.tab); }); });
  bindSwitchLinks();
  window.addEventListener('load', function(){ positionIndicator(document.querySelector('#tabs button.active')); });
  window.addEventListener('message', function(e){ if(e.data && e.data.type==='loginkit-accent'){ document.documentElement.style.setProperty('--copper', e.data.color); } });
})();
</script>

</body>
</html>
