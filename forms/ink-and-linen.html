<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ink &amp; Linen — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --linen:#f4efe4; --card:#fbf8f0; --line:#ddd4bd; --navy:#1f2b46; --navy-bright:#33456e;
    --ink:#241f18; --dim:#8a8069;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background-color:var(--linen);
    background-image:
      repeating-linear-gradient(0deg, rgba(36,31,24,0.015) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(36,31,24,0.015) 0 1px, transparent 1px 3px);
    color:var(--ink); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:60px 24px;
  }

  .stage{ width:100%; max-width:390px; text-align:center; }

  .stamp{ opacity:0; filter:blur(6px); transform:scale(1.12);
    animation:press .5s cubic-bezier(.2,.9,.3,1.1) forwards; animation-delay:.15s; }
  @keyframes press{ to{ opacity:1; filter:blur(0); transform:scale(1); } }

  .brand{ font-size:11px; letter-spacing:.2em; color:var(--navy); margin-bottom:14px; }
  h1{ font-family:'Fraunces', serif; font-weight:600; font-size:32px; margin-bottom:10px; }
  .sub{ font-size:13.5px; color:var(--dim); margin-bottom:8px; }

  .rule{ height:1px; background:var(--line); margin:26px 0 30px; transform:scaleX(0); transform-origin:center;
    animation:growRule .6s cubic-bezier(.65,0,.35,1) forwards; animation-delay:.55s; }
  @keyframes growRule{ to{ transform:scaleX(1); } }

  .panel{ text-align:left; opacity:0; animation:fadeUp .7s cubic-bezier(.16,1,.3,1) forwards; animation-delay:.6s; }
  @keyframes fadeUp{ to{ opacity:1; transform:none; } }
  .panel{ transform:translateY(8px); }

  .tabs{ display:flex; gap:24px; margin-bottom:28px; }
  .tabs button{ background:none; border:1.5px solid transparent; color:var(--dim); font-size:12px; font-weight:600; padding:6px 0 8px; cursor:pointer; transition:color .3s ease, border-color .3s ease; }
  .tabs button.active{ color:var(--ink); border-bottom-color:var(--navy); }

  .field{ position:relative; margin-bottom:20px; }
  .field label{ display:block; font-size:11px; letter-spacing:.04em; color:var(--dim); margin-bottom:6px; }
  .field input{ width:100%; background:var(--linen); border:1.5px solid var(--line); color:var(--ink); font-size:15px; padding:9px 11px; outline:none; transition:border-color .2s ease; }
  .field input:focus{ border-color:var(--navy); }
  .field input::placeholder{ color:var(--dim); opacity:.5; }
  .extra{ max-height:0; opacity:0; overflow:hidden; transition:max-height .5s cubic-bezier(.4,0,.2,1), opacity .35s ease; }

  .row-between{ display:flex; justify-content:space-between; font-size:12px; color:var(--dim); margin:0 0 28px; }
  .row-between a{ color:var(--dim); text-decoration:none; border-bottom:1px solid var(--line); }
  .row-between a:hover{ color:var(--navy); }
  .checkbox{ display:flex; align-items:center; gap:7px; }
  .checkbox input{ accent-color:var(--navy); width:13px; height:13px; }

  button.enter{ position:relative; width:100%; background:var(--navy); border:none; color:var(--linen); font-size:13.5px; font-weight:600; padding:14px; cursor:pointer; transition:background .3s ease, transform .1s ease; }
  button.enter:hover{ background:var(--navy-bright); }
  button.enter:active{ transform:scale(.99); }

  .divider{ display:flex; align-items:center; gap:14px; margin:24px 0; color:var(--dim); font-size:11px; }
  .divider::before,.divider::after{ content:""; flex:1; height:1px; background:var(--line); }
  button.ghost{ width:100%; background:none; border:1px solid var(--line); color:var(--ink); font-size:13px; padding:12px; cursor:pointer; transition:border-color .2s ease; }
  button.ghost:hover{ border-color:var(--navy); }

  .foot{ text-align:center; font-size:12.5px; color:var(--dim); margin-top:22px; }
  .foot a{ color:var(--navy); text-decoration:none; cursor:pointer; font-weight:600; }
  .foot a:hover{ text-decoration:underline; }
  :focus-visible{ outline:1px solid var(--navy); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }

  .field{ position:relative; }
  .eye-btn{
    position:absolute; right:2px; bottom:6px; background:none; border:none; padding:5px; cursor:pointer;
    color:var(--dim); display:flex; align-items:center; justify-content:center; transition:color .2s ease; z-index:2;
  }
  .eye-btn:hover{ color:var(--navy); }
  .eye-btn svg{ width:15px; height:15px; }
  input.has-eye{ padding-right:32px !important; }
</style>
</head>
<body>

<div class="stage">
  <div class="stamp">
    <div class="brand">INK &amp; LINEN CO.</div>
    <h1 id="heading">Sign in</h1>
    <p class="sub" id="subhead">Your orders, proofs, and saved stock.</p>
  </div>

  <div class="rule"></div>

  <div class="panel">
    <div class="tabs" id="tabs">
      <button class="active" data-tab="signin" type="button">Sign in</button>
      <button data-tab="signup" type="button">Create account</button>
    </div>

    <form onsubmit="return false;">
      <div class="field extra" id="nameField">
        <label for="nameInput">Full name</label>
        <input type="text" placeholder="Jordan Rivera" id="nameInput"  autocomplete="name" />
      </div>
      <div class="field">
        <label for="emailInput">Email address</label>
        <input type="email" placeholder="you@company.com" id="emailInput" required  autocomplete="email" />
      </div>
      <div class="field">
        <label for="pwInput">Password</label>
        <input type="password" placeholder="••••••••••••" id="pwInput" required  autocomplete="current-password"  class="has-eye" /><button type="button" class="eye-btn" data-for="pwInput" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <div class="field extra" id="confirmField">
        <label for="confirmInput">Confirm password</label>
        <input type="password" placeholder="••••••••••••" id="confirmInput"  autocomplete="new-password" />
      </div>
      <div class="row-between" id="signinOnlyRow">
        <label class="checkbox"><input type="checkbox" /> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>
      <button class="enter" type="submit"><span id="submitLabel">Sign in</span></button>
    </form>

    <div class="divider">or continue with</div>
    <button class="ghost" type="button">Google</button>

    <p class="foot" id="footNote">New here? <a data-switch="signup">Create an account</a></p>
  </div>
</div>

<script>
(function(){
  document.querySelectorAll('.eye-btn').forEach(function(btn){
    var input = document.getElementById(btn.dataset.for);
    if(!input) return;
    var showing = false;
    btn.addEventListener('click', function(){
      showing = !showing;
      input.type = showing ? 'text' : 'password';
      btn.setAttribute('aria-pressed', showing ? 'true' : 'false');
      btn.setAttribute('aria-label', showing ? 'Hide password' : 'Show password');
      btn.innerHTML = showing ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17.94 17.94A10.94 10.94 0 0112 19c-7 0-11-7-11-7a20.6 20.6 0 015.06-5.94M9.9 4.24A10.4 10.4 0 0112 4c7 0 11 7 11 7a20.6 20.6 0 01-2.16 3.19M14.12 14.12a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>';
    });
  });

  var tabs = document.querySelectorAll('#tabs button[data-tab]');
  var nameField = document.getElementById('nameField');
  var confirmField = document.getElementById('confirmField');
  var signinOnlyRow = document.getElementById('signinOnlyRow');
  var heading = document.getElementById('heading');
  var subhead = document.getElementById('subhead');
  var submitLabel = document.getElementById('submitLabel');
  var footNote = document.getElementById('footNote');

  var COPY = {
    signin: { heading:'Sign in', sub:'Your orders, proofs, and saved stock.', submit:'Sign in', foot:'New here? <a data-switch="signup">Create an account</a>' },
    signup: { heading:'Create your account', sub:'Set up your account in under a minute.', submit:'Create account', foot:'Already have an account? <a data-switch="signin">Sign in</a>' }
  };

  function bindSwitchLinks(){ document.querySelectorAll('[data-switch]').forEach(function(a){ a.addEventListener('click', function(e){ e.preventDefault(); setMode(a.getAttribute('data-switch')); }); }); }

  function setMode(mode){
    tabs.forEach(function(t){ t.classList.toggle('active', t.dataset.tab===mode); });
    var showExtra = mode==='signup';
    [nameField, confirmField].forEach(function(f){ f.style.maxHeight = showExtra ? f.scrollHeight+'px' : '0px'; f.style.opacity = showExtra?1:0; });
    signinOnlyRow.style.display = mode==='signin' ? 'flex' : 'none';
    heading.textContent = COPY[mode].heading;
    subhead.textContent = COPY[mode].sub;
    submitLabel.textContent = COPY[mode].submit;
    footNote.innerHTML = COPY[mode].foot;
    bindSwitchLinks();
  }
  tabs.forEach(function(t){ t.addEventListener('click', function(){ setMode(t.dataset.tab); }); });
  bindSwitchLinks();
  window.addEventListener('message', function(e){ if(e.data && e.data.type==='loginkit-accent'){ document.documentElement.style.setProperty('--navy', e.data.color); } });
})();
</script>

</body>
</html>
