<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ambergris — Member Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#160f09; --card:#1c140c; --line:rgba(212,158,79,0.16); --amber:#d49e4f; --amber-bright:#f0c581;
    --cream:#f1e6d3; --dim:#9c8a6e;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:radial-gradient(ellipse at 50% -10%, rgba(212,158,79,0.12), transparent 55%), var(--ink);
    color:var(--cream); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:60px 24px;
  }
  .stage{ width:100%; max-width:380px; text-align:center; }

  .vial-wrap{ display:flex; justify-content:center; margin-bottom:22px; }
  .vial{ width:46px; height:80px; }
  .vial .glass{ fill:none; stroke:var(--line); stroke-width:1.5; }
  .vial .liquid{ fill:var(--amber); opacity:.85; }
  .vial .liquid-clip{ animation:fill 1.4s cubic-bezier(.65,0,.35,1) forwards; animation-delay:.2s; }
  @keyframes fill{ from{ transform:translateY(46px); } to{ transform:translateY(0); } }
  .vial .stopper{ fill:var(--amber-bright); }

  .brand{ font-size:11px; letter-spacing:.22em; color:var(--amber); margin-bottom:14px;
    opacity:0; animation:fadeIn .7s ease forwards; animation-delay:.9s; }
  h1{ font-family:'Cormorant Garamond', serif; font-weight:500; font-style:italic; font-size:30px; margin-bottom:8px;
    opacity:0; animation:fadeUp .8s cubic-bezier(.16,1,.3,1) forwards; animation-delay:1s; }
  .sub{ font-size:13.5px; color:var(--dim); margin-bottom:30px;
    opacity:0; animation:fadeUp .8s cubic-bezier(.16,1,.3,1) forwards; animation-delay:1.06s; }
  @keyframes fadeIn{ to{ opacity:1; } }
  @keyframes fadeUp{ to{ opacity:1; transform:none; } }
  h1, .sub{ transform:translateY(8px); }

  .panel{ text-align:left; background:var(--card); border:1px solid var(--line); padding:36px 32px; border-radius:3px;
    opacity:0; animation:fadeUp .8s cubic-bezier(.16,1,.3,1) forwards; animation-delay:1.12s; }

  .tabs{ position:relative; display:flex; gap:4px; margin-bottom:28px; background:rgba(0,0,0,0.18); border:1px solid var(--line); border-radius:999px; padding:4px; }
  .tabs button{ position:relative; z-index:2; flex:1; background:none; border:none; color:var(--dim); font-size:12px; font-weight:600; padding:9px 0; cursor:pointer; transition:color .3s ease; border-radius:999px; }
  .tabs button.active{ color:#1c140c; }
  .tab-indicator{ position:absolute; top:4px; bottom:4px; z-index:1; border-radius:999px; background:var(--amber); box-shadow:0 4px 14px -4px rgba(212,158,79,0.5); transition:transform .45s cubic-bezier(.65,0,.35,1), width .45s cubic-bezier(.65,0,.35,1); }

  .field{ position:relative; margin-bottom:24px; }
  .field label{ position:absolute; left:0; top:11px; font-size:14px; color:var(--dim); pointer-events:none; transition:transform .3s cubic-bezier(.4,0,.2,1), font-size .3s ease, color .3s ease; transform-origin:left top; }
  .field input{ width:100%; background:none; border:none; border-bottom:1px solid var(--line); color:var(--cream); font-size:15px; padding:10px 0; outline:none; transition:border-color .3s ease; }
  .field .underline-accent{ position:absolute; left:0; right:0; bottom:-1px; height:1.5px; background:var(--amber-bright); transform:scaleX(0); transition:transform .4s cubic-bezier(.65,0,.35,1); box-shadow:0 0 8px var(--amber); }
  .field input:focus ~ .underline-accent{ transform:scaleX(1); }
  .field input:focus{ border-color:transparent; }
  .field input:focus + label, .field input:not(:placeholder-shown) + label{ transform:translateY(-19px); font-size:11px; color:var(--amber-bright); }
  .field input::placeholder{ color:transparent; }
  .extra{ max-height:0; opacity:0; overflow:hidden; transition:max-height .5s cubic-bezier(.4,0,.2,1), opacity .35s ease; }

  .row-between{ display:flex; justify-content:space-between; font-size:12px; color:var(--dim); margin:0 0 28px; }
  .row-between a{ color:var(--dim); text-decoration:none; border-bottom:1px solid var(--line); }
  .row-between a:hover{ color:var(--amber-bright); }
  .checkbox{ display:flex; align-items:center; gap:7px; }
  .checkbox input{ accent-color:var(--amber); width:13px; height:13px; }

  button.enter{ position:relative; width:100%; background:transparent; border:1px solid var(--amber); color:var(--amber-bright);
    font-family:'Cormorant Garamond', serif; font-style:italic; font-size:18px; padding:14px; cursor:pointer; overflow:hidden; isolation:isolate; transition:color .5s ease; }
  button.enter::before{ content:""; position:absolute; left:0; right:0; bottom:0; height:0%; background:linear-gradient(180deg, var(--amber-bright), var(--amber)); transition:height .5s cubic-bezier(.65,0,.35,1); z-index:-1; }
  button.enter:hover{ color:#1c140c; }
  button.enter:hover::before{ height:100%; }
  button.enter:active{ transform:scale(.99); }

  .divider{ display:flex; align-items:center; gap:14px; margin:24px 0; color:var(--dim); font-size:11px; }
  .divider::before,.divider::after{ content:""; flex:1; height:1px; background:var(--line); }
  button.ghost{ width:100%; background:none; border:1px solid var(--line); color:var(--cream); font-size:13px; padding:12px; cursor:pointer; transition:border-color .2s ease; }
  button.ghost:hover{ border-color:var(--amber); }

  .foot{ text-align:center; font-size:12.5px; color:var(--dim); margin-top:22px; }
  .foot a{ color:var(--amber-bright); text-decoration:none; cursor:pointer; }
  .foot a:hover{ text-decoration:underline; }
  :focus-visible{ outline:1px solid var(--amber-bright); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }

  .field{ position:relative; }
  .eye-btn{
    position:absolute; right:2px; bottom:6px; background:none; border:none; padding:5px; cursor:pointer;
    color:var(--dim); display:flex; align-items:center; justify-content:center; transition:color .2s ease; z-index:2;
  }
  .eye-btn:hover{ color:var(--amber-bright); }
  .eye-btn svg{ width:15px; height:15px; }
  input.has-eye{ padding-right:32px !important; }
</style>
</head>
<body>

<div class="stage">
  <div class="vial-wrap">
    <svg class="vial" viewBox="0 0 46 80">
      <defs><clipPath id="vialClip"><rect x="10" y="20" width="26" height="50" rx="4"/></clipPath></defs>
      <rect class="glass" x="10" y="20" width="26" height="50" rx="4"/>
      <rect class="glass" x="18" y="6" width="10" height="16"/>
      <rect class="stopper" x="16" y="2" width="14" height="6" rx="1"/>
      <g clip-path="url(#vialClip)">
        <rect class="liquid liquid-clip" x="10" y="34" width="26" height="36"/>
      </g>
    </svg>
  </div>

  <div class="brand">AMBERGRIS &amp; CO.</div>
  <h1 id="heading">Member sign in</h1>
  <p class="sub" id="subhead">Your fragrance profile and reserve list.</p>

  <div class="panel">
    <div class="tabs" id="tabs">
      <button class="active" data-tab="signin" type="button">Sign in</button>
      <button data-tab="signup" type="button">Join</button>
      <span class="tab-indicator" id="tabIndicator"></span>
    </div>

    <form onsubmit="return false;">
      <div class="field extra" id="nameField">
        <input type="text" placeholder=" " id="nameInput"  autocomplete="name" />
        <label for="nameInput">Full name</label>
        <span class="underline-accent"></span>
      </div>
      <div class="field">
        <input type="email" placeholder=" " id="emailInput" required  autocomplete="email" />
        <label for="emailInput">Email address</label>
        <span class="underline-accent"></span>
      </div>
      <div class="field">
        <input type="password" placeholder=" " id="pwInput" required  autocomplete="current-password"  class="has-eye" />
        <label for="pwInput">Password</label>
        <span class="underline-accent"></span><button type="button" class="eye-btn" data-for="pwInput" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <div class="field extra" id="confirmField">
        <input type="password" placeholder=" " id="confirmInput"  autocomplete="new-password" />
        <label for="confirmInput">Confirm password</label>
        <span class="underline-accent"></span>
      </div>
      <div class="row-between" id="signinOnlyRow">
        <label class="checkbox"><input type="checkbox" /> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>
      <button class="enter" type="submit"><span id="submitLabel">Enter</span></button>
    </form>

    <div class="divider">or continue with</div>
    <button class="ghost" type="button">Google</button>

    <p class="foot" id="footNote">New here? <a data-switch="signup">Join Ambergris</a></p>
  </div>
</div>

<script>
(function(){
  document.querySelectorAll('.eye-btn').forEach(function(btn){
    var input = document.getElementById(btn.dataset.for);
    if(!input) return;
    var showing = false;
    btn.addEventListener('click', function(){
      showing = !showing;
      input.type = showing ? 'text' : 'password';
      btn.setAttribute('aria-pressed', showing ? 'true' : 'false');
      btn.setAttribute('aria-label', showing ? 'Hide password' : 'Show password');
      btn.innerHTML = showing ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17.94 17.94A10.94 10.94 0 0112 19c-7 0-11-7-11-7a20.6 20.6 0 015.06-5.94M9.9 4.24A10.4 10.4 0 0112 4c7 0 11 7 11 7a20.6 20.6 0 01-2.16 3.19M14.12 14.12a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>';
    });
  });

  var tabs = document.querySelectorAll('#tabs button[data-tab]');
  var indicator = document.getElementById('tabIndicator');
  var nameField = document.getElementById('nameField');
  var confirmField = document.getElementById('confirmField');
  var signinOnlyRow = document.getElementById('signinOnlyRow');
  var heading = document.getElementById('heading');
  var subhead = document.getElementById('subhead');
  var submitLabel = document.getElementById('submitLabel');
  var footNote = document.getElementById('footNote');

  var COPY = {
    signin: { heading:'Member sign in', sub:'Your fragrance profile and reserve list.', submit:'Enter', foot:'New here? <a data-switch="signup">Join Ambergris</a>' },
    signup: { heading:'Join Ambergris', sub:'Create a profile to reserve limited pours.', submit:'Join', foot:'Already a member? <a data-switch="signin">Sign in</a>' }
  };

  function positionIndicator(el){ indicator.style.width = el.offsetWidth+'px'; indicator.style.transform = 'translateX('+el.offsetLeft+'px)'; }
  function bindSwitchLinks(){ document.querySelectorAll('[data-switch]').forEach(function(a){ a.addEventListener('click', function(e){ e.preventDefault(); setMode(a.getAttribute('data-switch')); }); }); }

  function setMode(mode){
    tabs.forEach(function(t){ t.classList.toggle('active', t.dataset.tab===mode); if(t.dataset.tab===mode) positionIndicator(t); });
    var showExtra = mode==='signup';
    [nameField, confirmField].forEach(function(f){ f.style.maxHeight = showExtra ? f.scrollHeight+'px' : '0px'; f.style.opacity = showExtra?1:0; });
    signinOnlyRow.style.display = mode==='signin' ? 'flex' : 'none';
    heading.textContent = COPY[mode].heading;
    subhead.textContent = COPY[mode].sub;
    submitLabel.textContent = COPY[mode].submit;
    footNote.innerHTML = COPY[mode].foot;
    bindSwitchLinks();
  }
  tabs.forEach(function(t){ t.addEventListener('click', function(){ setMode(t.dataset.tab); }); });
  bindSwitchLinks();
  window.addEventListener('load', function(){ positionIndicator(document.querySelector('#tabs button.active')); });
  window.addEventListener('message', function(e){ if(e.data && e.data.type==='loginkit-accent'){ document.documentElement.style.setProperty('--amber', e.data.color); } });
})();
</script>

</body>
</html>
